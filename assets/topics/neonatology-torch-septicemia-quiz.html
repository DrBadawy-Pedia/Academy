<script>
function theme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('dbp_theme',t);}catch(e){}
  const btn=document.getElementById('themeBtn');
  btn.textContent=t==='dark'?'☀️ Light':'🌙 Dark';
  document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F');
}
let savedTheme='light';
try{savedTheme=localStorage.getItem('dbp_theme')||(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
theme(savedTheme);
document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ---- Progress persistence (shared with index.html via localStorage) ---- */
const QUIZ_ID='neonatology-torch-septicemia-quiz';
const PROGRESS_KEY='dbp_quizProgress';
function getQuizProgress(){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    return all[QUIZ_ID]||{};
  }catch(e){return {};}
}
function saveQuizProgress(sectionIdx,score,total){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    if(!all[QUIZ_ID])all[QUIZ_ID]={};
    const pct=Math.round(score/total*100);
    const prev=all[QUIZ_ID][sectionIdx];
    all[QUIZ_ID][sectionIdx]={done:true,score,total,pct:(prev&&prev.pct>pct)?prev.pct:pct};
    localStorage.setItem(PROGRESS_KEY,JSON.stringify(all));
  }catch(e){}
}

const SECTIONS = [{"en":"TORCH & Neonatal Septicemia","icon":"TS","q":[{"en":"A woman suffered from repeated abortion due to toxoplasmosis. They catch infection by:","opts":["A-Cat's stool.","B-Blood transfusion.","C-Droplet.","D-Parental.","E-Sexual contact"],"ans":0,"exp":"Toxoplasma gondii is acquired from oocysts shed in cat feces (and also from undercooked meat); cat stool is the relevant route among the choices."},{"en":"A preterm baby was admitted to the incubator after 6 days and developed sepsis with the following non-specific manifestation:","opts":["A- Hypotension.","B- Jaundice.","C- Meningitis.","D- Pneumonia.","E- Septic arthritis"],"ans":0,"exp":"The stem is testing the typical neonatal sepsis pattern; A- Hypotension. best fits the timing, risk factor or clinical feature described."},{"en":"A woman suffered from repeated abortion due to cytomegalovirus infection. The virus can be isolated accurately from the baby's:","opts":["A- Cerebrospinal fluid (CSF).","B- Skin.","C- Sputum.","D- Stool.","E- Urine."],"ans":4,"exp":"Congenital CMV is classically detected by isolating/detecting virus in neonatal urine or saliva early in life."},{"en":"A preterm baby was admitted to the incubator after 2 days developed sepsis. The following organism was included as a cause of this condition:","opts":["A- Candida infection.","B- Fungal dissemination.","C- Group B Streptococci.","D- Pseudomonas organism.","E- Viral infection"],"ans":2,"exp":"Group B Streptococcus is a classic cause of early-onset neonatal infection acquired around delivery."},{"en":"A woman suffered from repeated abortion due to congenital cytomegalovirus infection. They catch infection by:","opts":["A- Cat's stool.","B- Droplet.","C- Genital lesion.","D- Raw meat.","E-Sexual contact"],"ans":4,"exp":"CMV may be transmitted through sexual contact and other body fluids; among the listed routes, sexual contact is the keyed route."},{"en":"A 34-week-old gestational-age preterm baby was admitted to the incubator at the age of one day due to neonatal sepsis with his mother suffering from a bad odor of amniotic fluid. The following is the causative organism:","opts":["A- Candida.","B- Group B Streptococci.","C- Klebsiella.","D- Pseudomonas","E- Staph. aureus."],"ans":1,"exp":"Group B Streptococcus is a classic cause of early-onset neonatal infection acquired around delivery."},{"en":"A preterm baby developed sepsis after 10 days. The following is the best investigation to diagnose this condition:","opts":["A-Blood culture.","B- C reactive protein.","C- Erythrocyte sedimentation rate.","D- Liver function.","E- Procalcitonin"],"ans":0,"exp":"Blood culture is the definitive microbiologic test for neonatal sepsis, while CRP and procalcitonin are supportive markers."},{"en":"The most common organism causing congenital pneumonia is:","opts":["Staph aureus","E coli","Group A streptococci","Group B streptococci"],"ans":3,"exp":"The keyed answer is Group B streptococci. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"Late neonatal pneumonia is commonly caused by:","opts":["A. Pseudomonas","B. Listeria monocytogenes","C. Proteus","D. Staphylococcus aureus"],"ans":3,"exp":"The keyed answer is D. Staphylococcus aureus. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"Congenital rubella syndrome is a disease due to:","opts":["A. Birth trauma","B. Postnatal bacterial infection","C. Chromosomal aberration","D. Viral transplacental infection"],"ans":3,"exp":"Congenital rubella results from maternal rubella viremia crossing the placenta and infecting the fetus."},{"en":"In premature rupture of membranes, the commonest complication is:","opts":["A. Precipitate labor.","B. Perinatal asphyxia","C. Antenatal hemorrhage.","D. Neonatal sepsis"],"ans":3,"exp":"The keyed answer is D. Neonatal sepsis. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"The common organism detected in late onset neonatal sepsis is:","opts":["A. Streptococci","B. Staphylococci","C. Klebsiella","D. H. influenza"],"ans":1,"exp":"Late-onset neonatal infection is commonly associated with hospital/environmental organisms, including staphylococci."},{"en":"A high serum IgM in an infant at birth indicates:","opts":["A. Prematurity.","B. Intracranial hemorrhage.","C. Intrauterine infection.","D. Immune deficiency diseases"],"ans":2,"exp":"Maternal IgM does not cross the placenta, so elevated neonatal IgM indicates that the infant produced it in response to intrauterine infection."},{"en":"In rubella syndrome, all features are correct EXCEPT:","opts":["A. Cataract & glaucoma","B. Mental retardation","C. Macrocephaly","D. Congenital heart disease"],"ans":2,"exp":"Congenital rubella is associated with growth restriction and microcephaly rather than macrocephaly; cataract and congenital heart disease are classic findings."},{"en":"Findings from WBCs, suggestive of neonatal sepsis include the following EXCEPT:","opts":["A. Total WBCs < 5000/mm","B. Lymphocytosis","C. Bandemia","D. Neutropenia"],"ans":1,"exp":"The stem is testing the typical neonatal sepsis pattern; B. Lymphocytosis best fits the timing, risk factor or clinical feature described."},{"en":"Intrauterine infection may result in all except:","opts":["A. Short stature.","B. Intraventricular hemorrhage.","C. Cataract.","D. Patent ductus arteriosus.","E. Mental handicap"],"ans":1,"exp":"Cataract, PDA, growth impairment and neurodevelopmental injury are recognized congenital-infection consequences; IVH is not a typical direct congenital-infection feature in this list."},{"en":"The following features suggest a diagnosis of toxoplasma as a cause of congenital infection:","opts":["A. Growth retardation","B. Petechiae","C. Focal chorioretinitis","D. Hydrocephalus","E. All of the above"],"ans":4,"exp":"Congenital toxoplasmosis can produce growth restriction, petechiae, chorioretinitis and hydrocephalus, so all listed findings may occur."},{"en":"The following are recognized risk factors for neonatal group B streptococcus (GBS) infection:","opts":["A. Preterm labor.","B. Prolonged rupture of membranes greater than 24 hours.","C. Chorioamnionitis.","D. Maternal GBS urinary tract infection.","E. All of the abov"],"ans":4,"exp":"The stem is testing the typical neonatal sepsis pattern; E. All of the abov best fits the timing, risk factor or clinical feature described."},{"en":"Early onset septicemia occurs in:","opts":["A. The 1st 24 hours","B. The 1st week of life","C. The 1st month","D. All of the above"],"ans":1,"exp":"The stem is testing the typical neonatal sepsis pattern; B. The 1st week of life best fits the timing, risk factor or clinical feature described."},{"en":"Risk factors for neonatal sepsis are:","opts":["A. Maternal suprapubic tenderness","B. Prematurity and low birthweight","C. Premature rupture of membranes","D. All of the above"],"ans":3,"exp":"Each listed item is a recognized risk factor or manifestation in the context of neonatal sepsis, so the combined option is correct."},{"en":"The common organism detected in early onset septicemia is:","opts":["A. Staphylococci","B. H. influenza","C. Group B Streptococci","D. Klebsiella"],"ans":2,"exp":"Group B Streptococcus is a classic cause of early-onset neonatal infection acquired around delivery."},{"en":"All of the following types of TORCH infections are sexually transmitted to the mother baby except","opts":["A. CMV","B. Herpes simplex","C. Syphilis","D. Toxoplasmosis"],"ans":3,"exp":"The keyed answer is D. Toxoplasmosis. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"Perinatal herpes simplex infection can present with in the newborn","opts":["A. Skin, eye, and mouth lesions","B. CNS infection","C. Sepsis-like (disseminated disease)","D. All of the above"],"ans":3,"exp":"Neonatal HSV can present as skin-eye-mouth disease, CNS disease or disseminated sepsis-like disease; all three patterns are recognized."},{"en":"Regarding congenital neonatal toxoplasma infection, which is false?","opts":["A. Hydrocephalus is a common association","B. Transmitted by inhalation of oocytes from the faces of the cat","C. Increased specific IgM to Toxoplasma gondii is diagnostic","D. Treatment is by Acyclovir"],"ans":3,"exp":"Acyclovir treats herpes viruses, not toxoplasmosis; congenital toxoplasmosis requires specific anti-Toxoplasma therapy."},{"en":"All of the following are risk factors for early sepsis except:","opts":["A. Maternal intrapartum fever,","B. Uterine tenderness,","C. Chorioamnionitis","D. PROM 6 hours before delivery"],"ans":3,"exp":"The stem is testing the typical neonatal sepsis pattern; D. PROM 6 hours before delivery best fits the timing, risk factor or clinical feature described."},{"en":"Neonatal sepsis is suggested in the presence of the following except:","opts":["A. WBC's count <5000 or 30000/cc.","B. Neutropenia <1000/cc.","C. Band count <10%","D. Positive CRP and procalcitonin"],"ans":2,"exp":"Sepsis is associated with bandemia/increased immature neutrophils; a band count below 10% does not support that pattern."},{"en":"The following features suggest a diagnosis of toxoplasma as a cause of congenital infection","opts":["A. Growth retardation","B. Petechiae","C. Focal chorioretinitis","D. Hydrocephalus","E. All of the above"],"ans":4,"exp":"Congenital toxoplasmosis can produce growth restriction, petechiae, chorioretinitis and hydrocephalus, so all listed findings may occur."}]}];

let curSection=null, i=0, score=0, answered=false, missed=[];
const app=document.getElementById('app');

function home(){
  curSection=null;
  const prog=getQuizProgress();
  let html='<div class="eyebrow">Choose a section</div><div class="sec-grid">';
  SECTIONS.forEach((s,idx)=>{
    const done=prog[idx]&&prog[idx].done;
    html+=`<div class="sec-card" onclick="startSection(${idx})">
      <div class="sec-top"><div class="sec-icon">${s.icon}</div><span class="sec-status${done?' done':''}">${done?'Completed · '+prog[idx].pct+'%':'Not started'}</span></div>
      <div class="sec-title">${s.en}</div>
      <div class="sec-count">${s.q.length} Questions</div>
    </div>`;
  });
  html+='</div><div class="intro-note">Pick a section to start its interactive quiz. Your progress is saved automatically on this device.</div>';
  app.innerHTML=html;
}

function startSection(idx){
  curSection=idx; i=0; score=0; missed=[];
  render();
}

function render(){
  const sec=SECTIONS[curSection], q=sec.q[i], pct=Math.round(i/sec.q.length*100);
  app.innerHTML=`<div class="topline">
    <div><div class="eyebrow">Score</div><div class="score-num">${score}<span> / ${sec.q.length}</span></div></div>
    <div class="topline-right">
      <div class="sec-label">${sec.en.toUpperCase()}</div>
      <div class="qcount">Question ${String(i+1).padStart(2,'0')} of ${sec.q.length}</div>
      <button class="back-link" onclick="home()">‹ Back to sections</button>
    </div>
  </div>
  <div class="progress-bar"><i style="width:${pct}%"></i></div>
  <div class="qbox">
    <div class="qwatermark">${String(i+1).padStart(2,'0')}</div>
    <div class="question-en">${q.en}</div>
  </div>
  <div class="choices">${q.opts.map((x,n)=>`<button class="choice" onclick="choose(${n})"><span class="badge">${String.fromCharCode(65+n)}</span><span>${x}</span></button>`).join('')}</div>
  <div id="feedback" class="feedback"></div>
  <div class="actions"><span class="hint">Choose one answer, then click Next</span><button id="next" class="btn next" disabled onclick="nextQ()">Next →</button></div>`;
  answered=false;
}

function choose(n){
  if(answered)return;
  answered=true;
  const sec=SECTIONS[curSection], q=sec.q[i], buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach(b=>b.disabled=true);
  buttons[q.ans].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(n===q.ans){
    score++;
    fb.className='feedback show good';
    fb.innerHTML=`<b>Correct!</b><div class="explain">${q.exp}</div>`;
  }else{
    buttons[n].classList.add('wrong');
    missed.push({num:i+1,en:q.en,correct:q.opts[q.ans]});
    fb.className='feedback show bad';
    fb.innerHTML=`<b>Not quite.</b><div class="explain">Correct answer: ${q.opts[q.ans]}<br>${q.exp}</div>`;
  }
  document.getElementById('next').disabled=false;
  document.querySelector('.score-num').innerHTML=`${score}<span> / ${sec.q.length}</span>`;
}

function nextQ(){
  const sec=SECTIONS[curSection];
  if(i<sec.q.length-1){i++;render()}else{result()}
}

function result(){
  const sec=SECTIONS[curSection], pct=Math.round(score/sec.q.length*100);
  saveQuizProgress(curSection,score,sec.q.length);
  let msg=pct>=85?'Excellent review.':pct>=65?'Solid work — revisit the points you missed.':'Review the summary again, then retake the quiz.';
  app.innerHTML=`<div class="result">
    <span class="eyebrow">Final Result · ${sec.en}</span>
    <div class="score-big">${score}/${sec.q.length}</div>
    <h2>${pct}%</h2>
    <p>${msg}</p>
    ${missed.length?`<div class="review"><b>Review points</b>${missed.map(x=>`<div><span class="tag">Q${x.num}</span> ${x.en}<br><small>Correct: <b>${x.correct}</b></small></div>`).join('')}</div>`:'<p>All correct. Well done!</p>'}
    <div class="result-actions">
      <button class="btn restart" onclick="startSection(${curSection})">Retry section</button>
      <button class="btn ghost" onclick="home()">Other sections</button>
    </div>
  </div>`;
}

home();
</script>

<script src="../assets/dbp-firebase-config.js"></script>
<script type="module" src="../assets/dbp-auth.js"></script>
</body>
