  const btn=document.getElementById('themeBtn');
  btn.textContent=t==='dark'?'☀️ Light':'🌙 Dark';

}

/* ---- Progress persistence (shared with index.html via localStorage) ---- */
const QUIZ_ID='neonatology-rd-rds-mid-quiz';
const PROGRESS_KEY='dbp_quizProgress';
function getQuizProgress(){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    return all[QUIZ_ID]||{};
  }catch(e){return {};}
}
function saveQuizProgress(sectionIdx,score,total){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    if(!all[QUIZ_ID])all[QUIZ_ID]={};
    const pct=Math.round(score/total*100);
    const prev=all[QUIZ_ID][sectionIdx];
    all[QUIZ_ID][sectionIdx]={done:true,score,total,pct:(prev&&prev.pct>pct)?prev.pct:pct};
    localStorage.setItem(PROGRESS_KEY,JSON.stringify(all));
  }catch(e){}
}

const SECTIONS = [{"en":"Neonatal RD, Cyanosis & RDS","icon":"RD","q":[{"en":"Caesarian section was done for preterm baby delivered with respiratory rate 70/m, working alae nasi and subcostal retraction. What is the grade of respiratory distress in this baby? (Mid 51)","opts":["Grade I (Mild)","Grade II (Moderate)","Grade III (Severe)","Grade IV (Advanced)","Grade V (Super advanced)"],"ans":1,"exp":"The features given in the stem correspond to Grade II (Moderate) in the grading used in this question set."},{"en":"Caesarian section was done for preterm baby delivered with respiratory rate 80/m, working alae nasi, subcostal retraction and cyanosis. What is the grade of respiratory distress in this baby? (Final 52)","opts":["Grade I (Mild)","Grade II (Moderate)","Grade III (Severe)","Grade IV (Advanced)","Grade V (Super advanced)"],"ans":3,"exp":"The features given in the stem correspond to Grade IV (Advanced) in the grading used in this question set."},{"en":"Mother was delivered a 30 weeks neonate with respiratory distress syndrome and the following specific treatment was given to this baby by the endotracheal tube. (Mid 51)","opts":["Adrenaline","Antibiotic","Atropine","Dexamethazone","Surfactant"],"ans":4,"exp":"The correct answer is Surfactant. This is the association tested by the stem."},{"en":"The surfactant is produced / secreted by alveolar cells type: (Final 51) (TBL 52)","opts":["I","II","III","IV","V"],"ans":1,"exp":"The correct answer is II. This is the association tested by the stem."},{"en":"Meconium aspiration occurs more in: (Final 51)","opts":["Extremely preterm","Full term","Near term","Preterm","Post term"],"ans":4,"exp":"The correct answer is Post term. This is the association tested by the stem."},{"en":"A full term baby was delivered with the following non metabolic cause of respiratory distress: (Final 51)","opts":["Hyperthermia","Hypoglycemia","Hypothermia","Metabolic acidosis","Polycythemia"],"ans":4,"exp":"The correct answer is Polycythemia. ure","Respiratory distress is usually severe","Better treated by penicillin","Usually improves within 2 weeks","Occur mainly after cesarean section"],"ans":4,"exp":"The correct answer is Occur mainly after cesarean section. This is the association tested by the stem."},{"en":"A preterm baby 32 weeks delivered with respiratory distress (RDIV) within few hours of normal vaginal delivery with Pao2 80% and Paco2 65% and has developed neonatal jaundice and convulsions on the 3rd day. [1] The most common cause of respiratory distress in this baby is: (OSPE 53 Fak)","opts":["Diaphragmatic hernia","Meconium aspiration","Respiratory distress syndrome","Transient tachypnea of newborn"],"ans":2,"exp":"The correct answer is Respiratory distress syndrome. This is the association tested by the stem."},{"en":"A newly born infant full-term weights 3.2 kg was born by caesarian section and there was little amniotic fluid. He cried after birth with good AGAR score (8) but later on after few hours he started to develop distress, but no cyanosis. X-ray showed fluid in lung fissures and increased bronchovesicular markings. What is the most probable diagnosis? (Dec 2013) (Oct 2016) (Oct 2018)","opts":["Meconium aspiration","Congenital pneumonia","Transient tachypnea of the newborn","Respiratory distress syndrome"],"ans":2,"exp":"The findings in the stem point to Transient tachypnea of the newborn, which is the keyed diagnosis for this item."},{"en":"Metabolic cause of neonatal respiratory distress: (Oct 2017)","opts":["Metabolic alkalosis","Hypokalemia","Hypoglycemia","Hypernatremia"],"ans":2,"exp":"The correct answer is Hypoglycemia. This is the association tested by the stem."},{"en":"We give the pregnant mother corticosteroid to prevent RDS in her preterm neonate: (Oct 2017)","opts":["Before delivery","After delivery","Before & after delivery","During delivery"],"ans":0,"exp":"The correct answer is Before delivery. This is the association tested by the stem."},{"en":"A male neonate with tachpnea, working ala nasi and subcostal & intercostal retractions have: (Dec 2015)","opts":["Respiratory distress grade I","Respiratory distress grade II","Respiratory distress grade III","Cental respiratory failure"],"ans":1,"exp":"The correct answer is Respiratory distress grade II. This is the association tested by the stem."},{"en":"Surfactant production: (Dec 2016) (Oct 2019)","opts":["Takes place in type 1 pneumocytes","Can be detected at 20 weeks gestation","Is decreased by maternal corticosteroid administration","Is decreased by intrauterine growth retardation (IUGR)","Is decreased by maternal opiate abuse"],"ans":1,"exp":"The correct answer is Can be detected at 20 weeks gestation. This is the association tested by the stem."},{"en":"In grade II respiratory distress the following is observed: (Dec 2019)","opts":["Tachypnea & working ala nasi","Intercostal & subcostal retraction","Central cyanosis","A+B"],"ans":3,"exp":"The features given in the stem correspond to A+B in the grading used in this question set."},{"en":"Grade III neonatal respiratory distress is considered if we found:","opts":["Tachypnea and active alae nasi","Chest retractions","Grunting","All the above"],"ans":3,"exp":"The features given in the stem correspond to All the above in the grading used in this question set."},{"en":"The following are risk factors of RDS EXCEPT:","opts":["First twin","Preterm","Second twin","Maternal diabetes"],"ans":0,"exp":"First twin is the exception in this item; the remaining choices fit the pattern being tested."},{"en":"Respiratory distress syndrome is mostly seen in the following EXCEPT:","opts":["Infants of normal birth weight","Infants of diabetic mother","Premature","Second twin"],"ans":0,"exp":"Infants of normal birth weight is the exception in this item; the remaining choices fit the pattern being tested."},{"en":"Manifestations of respiratory distress in a newborn secondary to central nervous failure are (is):","opts":["Apnea","Respiratory grunt","Intercostal retraction","B+C"],"ans":0,"exp":"The correct answer is Apnea. This is the association tested by the stem."},{"en":"Ground glass appearance and air bronchogram in an x ray chest of newborn can be found in:","opts":["Respiratory distress syndrome","Neonatal pneumonia","Transient tachypnea of the newborn","None of the above"],"ans":0,"exp":"The image and stem are keyed to Respiratory distress syndrome. Focus on matching the displayed finding with the listed neonatal pattern."},{"en":"Considering signs of respiratory distress which of the following is false:","opts":["Tachypnea","Working alae nasi","Intercostals subcostal, suprasternal retraction","Grunting","Bradypnea"],"ans":4,"exp":"Bradypnea is the exception in this item; the remaining choices fit the pattern being tested."},{"en":"The most common cause of neonatal death is:","opts":["Neonatal pneumonia","Sepsis","RDS","Neonatal GE","Meconium aspiration syndrome"],"ans":2,"exp":"The correct answer is RDS. This is the association tested by the stem."},{"en":"All the followings are risk factors of RDS except:","opts":["Prematurity","Infant of diabetic mother","Caesarian section","Perinatal asphyxia","1st twin baby"],"ans":4,"exp":"1st twin baby is the exception in this item; the remaining choices fit the pattern being tested."},{"en":"(Neonate Cases) Term, 4200-g female infant is delivered via cesarean section because of cephalopelvic disproportion. The amniotic fluid was clear, and the infant cried almost immediately after birth. Within the first 15 min of life, however, the infant's respiratory rate increased to 80 breaths per min, and she began to have intermittent grunting respirations. The infant was transferred to the nursery and was noted to have an oxygen saturation of 94%. The chest radiograph showed fluid in the fissure, over aeration, and prominent pulmonary vascular markings. What is your diagnosis?","opts":["Neonatal RD for DD mostly MAS","Neonatal RD for DD mostly TTN","Neonatal RD for DD mostly RDS"],"ans":1,"exp":"The findings in the stem point to Neonatal RD for DD mostly TTN, which is the keyed diagnosis for this item."},{"en":"(Neonate Cases) A male baby born at 32 weeks gestation because of preterm delivery. The pregnancy was uneventful. The baby developed tachypnea at 6 hours which increased gradually. Chest examination revealed bilateral decreased air entry. The chest X-ray revealed air bronchogram and ground glass appearance. What is your diagnosis?","opts":["Transient tachypnea of the newborn","Hyaline Membrane Disease","Meconium aspiration","Perinatal asphyxia"],"ans":1,"exp":"The findings in the stem point to Hyaline Membrane Disease, which is the keyed diagnosis for this item."},{"en":"(Neonate Cases) A post term infant is born at home after a prolonged and difficult labor. The maternal grandmother brings the infant to the hospital at 1 h of life because of fast breathing. Grandmother notes that the child spit up some dark brown particulate fluid shortly after birth, Physical examination reveals an infant in marked respiratory distress. Other findings include both an umbilical cord and flaking skin with a yellow-green hue. Chest radiograph reveals patchy infiltrates bilaterally. What is your diagnosis","opts":["Transient tachypnea of the newborn","Congenital pneumonia","Meconium aspiration syndrome","Respiratory distress syndrome"],"ans":2,"exp":"The findings in the stem point to Meconium aspiration syndrome, which is the keyed diagnosis for this item."}]}];

    const done=prog[idx]&&prog[idx].done;
    html+=`<div class="sec-card" onclick="startSection(${idx})">
      <div class="sec-top"><div class="sec-icon">${s.icon}</div><span class="sec-status${done?' done':''}">${done?'Completed · '+prog[idx].pct+'%':'Not started'}</span></div>
      <div class="sec-title">${s.en}</div>
      <div class="sec-count">${s.q.length} Questions</div>
    </div>`;
  });
  html+='</div><div class="intro-note">Pick a section to start its interactive quiz. Your progress is saved automatically on this device.</div>';
  app.innerHTML=html;
}

function startSection(idx){
  curSection=idx; i=0; score=0; missed=[];
  render();
}

function render(){
  const sec=SECTIONS[curSection], q=sec.q[i], pct=Math.round(i/sec.q.length*100);
  app.innerHTML=`<div class="topline">
    <div><div class="eyebrow">Score</div><div class="score-num">${score}<span> / ${sec.q.length}</span></div></div>
    <div class="topline-right">
      <div class="sec-label">${sec.en.toUpperCase()}</div>
      <div class="qcount">Question ${String(i+1).padStart(2,'0')} of ${sec.q.length}</div>
      <button class="back-link" onclick="home()">‹ Back to sections</button>
    </div>
  </div>
  <div class="progress-bar"><i style="width:${pct}%"></i></div>
  <div class="qbox">
    <div class="qwatermark">${String(i+1).padStart(2,'0')}</div>
    <div class="question-en">${q.en}</div>
  </div>
  ${q.img?`<img class="qimage" src="${q.img}" alt="Clinical question image">`:``}
  <div class="choices">${q.opts.map((x,n)=>`<button class="choice" onclick="choose(${n})"><span class="badge">${String.fromCharCode(65+n)}</span><span>${x}</span></button>`).join('')}</div>
  <div id="feedback" class="feedback"></div>
  <div class="actions"><span class="hint">Choose one answer, then click Next</span><button id="next" class="btn next" disabled onclick="nextQ()">Next →</button></div>`;
  answered=false;
}

function choose(n){
  if(answered)return;
  answered=true;
  const sec=SECTIONS[curSection], q=sec.q[i], buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach(b=>b.disabled=true);
  buttons[q.ans].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(n===q.ans){
    score++;
    fb.className='feedback show good';
    fb.innerHTML=`<b>Correct!</b><div class="explain">${q.exp}</div>`;
  }else{
    buttons[n].classList.add('wrong');
    missed.push({num:i+1,en:q.en,correct:q.opts[q.ans]});
    fb.className='feedback show bad';
    fb.innerHTML=`<b>Not quite.</b><div class="explain">Correct answer: ${q.opts[q.ans]}<br>${q.exp}</div>`;
  }
  document.getElementById('next').disabled=false;
  document.querySelector('.score-num').innerHTML=`${score}<span> / ${sec.q.length}</span>`;
}

function nextQ(){
  const sec=SECTIONS[curSection];
  if(i<sec.q.length-1){i++;render()}else{result()}
}

function result(){
  const sec=SECTIONS[curSection], pct=Math.round(score/sec.q.length*100);
  saveQuizProgress(curSection,score,sec.q.length);
  let msg=pct>=85?'Excellent review.':pct>=65?'Solid work — revisit the points you missed.':'Review the summary again, then retake the quiz.';
  app.innerHTML=`<div class="result">
    <span class="eyebrow">Final Result · ${sec.en}</span>
    <div class="score-big">${score}/${sec.q.length}</div>
    <h2>${pct}%</h2>
    <p>${msg}</p>
    ${missed.length?`<div class="review"><b>Review points</b>${missed.map(x=>`<div><span class="tag">Q${x.num}</span> ${x.en}<br><small>Correct: <b>${x.correct}</b></small></div>`).join('')}</div>`:'<p>All correct. Well done!</p>'}
    <div class="result-actions">
      <button class="btn restart" onclick="startSection(${curSection})">Retry section</button>
      <button class="btn ghost" onclick="home()">Other sections</button>
    </div>
  </div>`;
}

home();
</script>

<script type="module" src="../assets/dbp-auth.js"></script>
