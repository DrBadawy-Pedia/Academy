</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="neonatology-quiz.html"><div class="logo">MB</div><div><b>Dr Badawy Academy</b><small>PEDIATRICS · NEONATOLOGY</small></div></a><button class="top-btn" id="themeBtn">🌙 Dark</button></header><main><section class="hero"><div class="kicker">NEONATOLOGY · FINAL MCQs</div><h1>Classification of Newborn, Dysmaturity &amp; Postmaturity</h1><p>18 exam-style questions with instant correction and concise explanations.</p></section><section class="quiz-card"><div id="quizView"><div class="meta"><span id="progress"></span><span id="scoreLive">Score 0</span></div><div class="question" id="question"></div><img id="qimg" class="qimg" hidden><div class="options" id="options"></div><div class="explain" id="explain"></div><div class="actions"><button class="btn secondary" id="prevBtn">← Previous</button><button class="btn" id="nextBtn" disabled>Next →</button></div></div><div class="result" id="result"><div>Quiz complete</div><div class="score" id="finalScore"></div><p id="finalText"></p><button class="btn" onclick="restartQuiz()">Try Again</button></div></section></main><footer class="footer">DR BADAWY ACADEMY · PEDIATRICS · Interactive Learning</footer></div><script>
const QUIZ_ID="neonatology-classification-dysmaturity-postmaturity-quiz"; const PROGRESS_KEY='dbp_quizProgress'; const QUESTIONS=[{"num": 2, "q": "A pregnant woman delivered a 44 weeks gestational age baby with the following character:", "options": ["Closed eye", "Meconium stained", "Short hair", "Short nail"], "answer": 1, "explanation": "Postmaturity is associated with placental insufficiency and fetal stress, so meconium staining is common."}, {"num": 3, "q": "Mother was delivered a 40 weeks neonate; the following treatment was given to this baby to prevent bleeding.", "options": ["Adrenaline", "Gentamycin", "Konakion", "Paracetamol"], "answer": 2, "explanation": "Newborn vitamin K stores are low; prophylactic vitamin K (Konakion) prevents vitamin-K-deficiency bleeding."}, {"num": 4, "q": "A mother delivered a post term baby who defined as baby delivered after ...... week's gestational age.", "options": ["40", "41", "42", "43"], "answer": 2, "explanation": "Post-term/postmature birth is defined after 42 completed weeks of gestation."}, {"num": 5, "q": "Caesarian section was done for baby then gestational age was determined by ossification centers. The normal time of appearance of ossification centers of Lower end of femur & upper end of tibia is:", "options": ["6 months of pregnancy", "7 months of pregnancy", "8 months of pregnancy", "9 months of pregnancy"], "answer": 3, "explanation": "The keyed answer is 9 months of pregnancy. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 6, "q": "A pregnant woman delivered a small for gestational age baby with the following complication:", "options": ["Hypercalcemia", "Hyperglycemia", "Hyperthermia", "Hypoxia"], "answer": 3, "explanation": "Placental insufficiency and chronic fetal compromise make SGA infants vulnerable to hypoxia/asphyxia."}, {"num": 7, "q": "Pregnant female delivered preterm baby . The preterm bay is defined as baby delivered before", "options": ["34 week .", "35 week", "36 week .", "37 week", "38 week"], "answer": 3, "explanation": "Prematurity is birth before 37 completed weeks of gestation."}, {"num": 8, "q": "Emergency Caesarian sectionon for women with eclampsia The baby delivered with weight <10th centile of expected from his gestational age . The following complication can occur in this baby :", "options": ["Hypercalcemia .", "Hypermagnesemia", "Hypokalemia .", "Hyponatremia .", "Hypothermia ."], "answer": 4, "explanation": "SGA infants have little subcutaneous fat and limited energy reserves, predisposing them to hypothermia."}, {"num": 9, "q": "A 30 years old woman was delivered a baby 44 weeks gestational age. The following is not manifestation of this condition", "options": ["Active .", "Alert .", "Meconium stained .", "Rough wrinkled skin .", "Short nail ."], "answer": 4, "explanation": "Post-term infants characteristically have long nails; short nails therefore do not fit postmaturity."}, {"num": 10, "q": "Meconium aspiration occurs more in :", "options": ["Extremely preterm .", "Near term .", "Full term .", "Preterm .", "Post term"], "answer": 4, "explanation": "The keyed answer is Post term. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 11, "q": "Baby is considered Post mature if gestational age:", "options": ["more than 38 weeks", "more than 44 weeks", "more than 42 weeks", "more than 37 weeks"], "answer": 2, "explanation": "Post-term/postmature birth is defined after 42 completed weeks of gestation."}, {"num": 12, "q": "15-A pregnant woman delivered a small for gestational age baby. The following is not character of this condition:", "options": ["Absent subcutaneous fate.", "Loose skin.", "Low temperature.", "Muscle wasting.", "Wet skin."], "answer": 4, "explanation": "SGA/dysmature infants tend to have reduced subcutaneous fat and loose, dry or wrinkled skin; wet skin is not typical."}, {"num": 13, "q": "Post maturity is not associated with the following:", "options": ["Meconium stain", "Loose skin", "Short nails", "Skin desquamation"], "answer": 2, "explanation": "Post-term infants characteristically have long nails; short nails therefore do not fit postmaturity."}, {"num": 14, "q": "A very low birth weight infant is an infant with birth weight of", "options": ["2-2.5 kg", "<2 kg", "< 1.5 kg", "< 1 kg"], "answer": 2, "explanation": "Very low birth weight is defined as birth weight below 1.5 kg (1500 g)."}, {"num": 15, "q": "The following are recognized complienations in a post term baby EXCEPT: Another form: The following are recognized complications in a post term baby except: A. Birth asphyxia. B. Hypoglycemia. C. Hyaline membrane disease. D. Pulmonary hemorrhage. E. Meconium aspiration.", "options": ["Birth asphyxia.", "Hypoglycema.", "Hyaline membrane disease.", "Hypocalcemia"], "answer": 2, "explanation": "Hyaline membrane disease is primarily a disease of prematurity due to surfactant deficiency, not a typical post-term complication."}, {"num": 16, "q": "Very low birth weight infant is an infant with birth weight of: Another form: Very low birth weight baby (VLBW) is an infant whose weight at birth is: A. < 1000 gm B. <1500gm C. <2000gm D. <2500gm", "options": ["1800 gm or less", "1500 gm or less", "1000 gm or less", "<2000gm"], "answer": 1, "explanation": "Very low birth weight is defined as birth weight below 1.5 kg (1500 g)."}, {"num": 17, "q": "A full-term baby is delivered ..... weeks' gestation", "options": ["32", "34", "36", "38"], "answer": 3, "explanation": "The keyed answer is 38. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 18, "q": "Small-for-gestational-age infants are more likely than appropriate-for-gestational-age infants to have all except:", "options": ["Birth asphyxia", "Hypocalcemia.", "Meconium aspiration", "Hyperglycemia"], "answer": 3, "explanation": "The keyed answer is Hyperglycemia. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 19, "q": "A light-for-dates full-term baby is at particular risk from the following conditions:", "options": ["Hyaline membrane disease.", "Physiological jaundice.", "Milk aspiration.", "Hypoglycemia.", "Apneic attacks."], "answer": 3, "explanation": "SGA infants have limited glycogen and fat reserves, making hypoglycemia a major risk."}]; let idx=0,score=0,answers=Array(QUESTIONS.length).fill(null);
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const q=QUESTIONS[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${QUESTIONS.length}`;document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('question').textContent=q.q;const img=document.getElementById('qimg');if(q.image){img.src=q.image;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')};const box=document.getElementById('options');box.innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');const exp=document.getElementById('explain');exp.style.display='none';exp.innerHTML='';document.getElementById('nextBtn').disabled=answers[idx]===null;document.getElementById('prevBtn').disabled=idx===0;box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));if(answers[idx]!==null)showAnswered()}
function choose(i){if(answers[idx]!==null)return;answers[idx]=i;if(i===QUESTIONS[idx].answer)score++;showAnswered();document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('nextBtn').disabled=false}
function showAnswered(){const q=QUESTIONS[idx],chosen=answers[idx];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===chosen&&i!==q.answer)b.classList.add('wrong')});const e=document.getElementById('explain');e.innerHTML=`<b>Explanation</b><br>${esc(q.explanation)}`;e.style.display='block'}
document.getElementById('nextBtn').onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render()}else finish()};document.getElementById('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};
function finish(){document.getElementById('quizView').style.display='none';document.getElementById('result').style.display='block';const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('finalScore').textContent=`${score} / ${QUESTIONS.length}`;document.getElementById('finalText').textContent=`${pct}%`;try{const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');all[QUIZ_ID]={0:{done:true,score,total:QUESTIONS.length,pct}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(all))}catch(e){}}
function restartQuiz(){idx=0;score=0;answers=Array(QUESTIONS.length).fill(null);document.getElementById('quizView').style.display='block';document.getElementById('result').style.display='none';render()}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('dbp_theme',t)}catch(e){};document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light':'🌙 Dark';document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F')}let saved='light';try{saved=localStorage.getItem('dbp_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}theme(saved);document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');render();
</script></body></html>
