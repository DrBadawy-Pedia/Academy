<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8F8;--surface:#FFF;--surface2:#FBFCFC;--ink:#17233F;--soft:#2B3650;--muted:#71808B;--faint:#9AA5AE;--line:#E3E9EA;--navy:#1D2A4D;--navy2:#12213E;--navybg:#EAF7F5;--gold:#B8892B;--gold2:#E8BD5B;--goldbg:#FFF8E8;--teal:#178F8C;--tealbg:#EAF7F5;--red:#AD2B22;--green:#1F8F5F;--greenbg:#EAF7EF;--redbg:#FBEAEA;--shadow:0 12px 34px rgba(24,46,65,.07);--shadow2:0 20px 55px rgba(24,46,65,.18);--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
[data-theme=dark]{--bg:#10141B;--surface:#191D26;--surface2:#1F242F;--ink:#EDF0F4;--soft:#D7DCE5;--muted:#98A3B5;--faint:#707B8C;--line:#2B313B;--navy:#6AA7DE;--navy2:#091624;--navybg:#1B2B3E;--gold:#E6B955;--gold2:#E6B955;--goldbg:#2E2715;--teal:#54C5B2;--tealbg:#142925;--green:#54C58A;--greenbg:#12291E;--red:#E07A72;--redbg:#301616}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button{font:inherit;color:inherit}::selection{background:var(--goldbg);color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.app{min-height:100vh}.shell{max-width:1180px;margin:auto;padding:0 24px 70px}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:11px}.mini-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:#10283E;font-family:Georgia,serif;font-size:16px;font-weight:800;letter-spacing:-2px;box-shadow:0 7px 18px rgba(0,0,0,.14)}
.brand-text{font-family:var(--serif);font-weight:600;line-height:1.1;font-size:15px}.brand-text small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.11em;color:var(--muted);font-weight:800;margin-top:4px}
.top-actions{display:flex;gap:8px}.top-btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px;font-size:11.5px;font-weight:800;cursor:pointer}.top-btn:hover{border-color:#BFC6D0}

/* Hero — identical component to the homepage hero */
.hero{position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(118deg,#1D294C 0%,#24375E 56%,#127E80 150%);padding:44px 48px 42px;color:#fff;box-shadow:var(--shadow2)}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.09);border-radius:50%;pointer-events:none}
.hero:before{width:470px;height:470px;right:-220px;top:-290px}.hero:after{width:300px;height:300px;right:-80px;bottom:-230px}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:start}
.hero-kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold2);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-family:var(--serif);font-size:clamp(36px,5.5vw,60px);line-height:.98;letter-spacing:-.035em;margin:0;max-width:620px}
.hero h1 span{color:var(--gold2)}
.hero p{max-width:600px;margin:17px 0 0;color:rgba(255,255,255,.77);font-size:14.5px;line-height:1.7}
.hero-mark{width:116px;height:116px;border-radius:30px;background:linear-gradient(145deg,#F7D990,#A87516);display:grid;place-items:center;color:#10283E;font-family:Georgia,serif;font-size:39px;font-weight:800;letter-spacing:-5px;box-shadow:0 18px 38px rgba(0,0,0,.25);transform:rotate(4deg)}
@media(max-width:800px){.hero{padding:28px 22px;border-radius:23px}.hero-grid{grid-template-columns:1fr}.hero-mark{position:absolute;right:18px;top:22px;width:68px;height:68px;border-radius:19px;font-size:25px}.hero h1{font-size:42px;padding-right:55px}.hero p{font-size:13.5px}}
@media(max-width:480px){.hero h1{font-size:35px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 30px;margin-top:18px;box-shadow:var(--shadow)}

.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}

.sec-grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:10px}
.sec-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:17px;padding:20px;text-align:left;cursor:pointer;transition:.18s ease;display:flex;flex-direction:column;gap:9px;box-shadow:0 8px 22px rgba(30,55,65,.04)}
.sec-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(30,55,65,.1);border-color:#B7DEDA}
.sec-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-icon{width:38px;height:38px;border-radius:11px;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;font-size:12px;font-weight:800;font-family:var(--sans)}
.sec-status{font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--faint);text-transform:uppercase}
.sec-status.done{color:var(--teal)}
.sec-title{font-family:var(--sans);font-weight:700;font-size:14.5px;color:var(--ink);line-height:1.4;margin-top:6px}
.sec-count{font-size:10px;color:var(--faint);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.intro-note{margin-top:18px;font-size:11.5px;color:var(--faint);text-align:center}

.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.score-num{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ink)}
.score-num span{font-size:15px;color:var(--muted);font-weight:500;font-family:var(--sans)}
.topline-right{text-align:right}
.sec-label{color:var(--teal);font-weight:800;font-size:11px;letter-spacing:.04em}
.qcount{color:var(--muted);font-size:12px}
.back-link{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;margin-top:5px;font-family:var(--sans)}

.progress-bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 28px}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--teal));width:0;transition:.3s;border-radius:99px}

.qbox{position:relative;padding:0 4px}
.qwatermark{position:absolute;top:-14px;right:0;font-family:var(--serif);font-size:56px;font-weight:700;color:var(--goldbg);z-index:0;line-height:1}
[data-theme=dark] .qwatermark{color:#2A2313}
.question-en{position:relative;z-index:1;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.35;margin:4px 0 24px;color:var(--ink);max-width:90%}

.choices{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:620px){.choices{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--surface2);border-radius:13px;padding:13px 14px;text-align:left;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;transition:.18s ease}
.choice:hover:not(:disabled){border-color:var(--teal);background:var(--tealbg);transform:translateY(-1px)}
.choice:disabled{cursor:default}
.choice .badge{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;font-family:var(--sans)}
.choice.correct{border-color:var(--green);background:var(--greenbg)}
.choice.correct .badge{background:var(--green);color:#fff;border-color:var(--green)}
.choice.wrong{border-color:var(--red);background:var(--redbg)}
.choice.wrong .badge{background:var(--red);color:#fff;border-color:var(--red)}

.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.7;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--greenbg);color:var(--green)}
.feedback.bad{background:var(--redbg);color:var(--red)}
.explain{margin-top:5px;font-weight:400;color:var(--soft)}

.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.hint{color:var(--faint);font-size:12px}
.btn{border:0;border-radius:11px;padding:12px 22px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--sans)}
.next{background:var(--navy);color:#fff}
[data-theme=dark] .next{background:var(--teal);color:#091624}
.next:disabled{opacity:.35;cursor:not-allowed}
.restart{background:var(--teal);color:#fff}
[data-theme=dark] .restart{color:#091624}
.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}

.result{text-align:center;padding:4px}
.result .eyebrow{display:block;margin-bottom:6px}
.score-big{font-family:var(--serif);font-size:50px;color:var(--ink);font-weight:700;margin:4px 0}
.result h2{margin:0 0 8px;color:var(--teal);font-size:22px;font-family:var(--serif)}
.result p{font-size:13.5px;line-height:1.7;color:var(--muted)}
.review{margin-top:18px;text-align:left;background:var(--surface2);padding:16px;border-radius:14px;border:1px solid var(--line)}
.review div{padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:13px}
.review div:last-child{border-bottom:0}
.review small{display:inline-block;color:var(--muted)}
.tag{display:inline-block;background:var(--goldbg);color:var(--gold);padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:800;margin:0 4px}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

.footer{text-align:center;padding-top:30px;color:var(--faint);font-size:10.5px}
.footer b{font-family:var(--serif);font-size:13px;color:var(--soft);display:block;margin-bottom:3px}

@media(max-width:600px){
  .shell{padding:0 15px 70px}
  .card{padding:20px}
  .question-en{font-size:19px;max-width:100%}
  .actions{align-items:stretch;flex-direction:column}
  .btn{width:100%}
  .qwatermark{font-size:40px}
}
</style>
</head>
<body>
<div class="app"><div class="shell">

<header class="topbar">

<nav class="top-actions">
<a class="top-btn" href="../index.html#quizzes">All Quizzes</a>
<button class="top-btn" id="themeBtn">🌙 Dark</button>
</nav>
</header>

<main>

<section class="hero" aria-label="Introduction">
<div class="hero-grid">
<div>
<div class="hero-kicker">PRACTICE &amp; ASSESSMENT</div>
<h1>Classification, Dysmaturity &amp; Postmaturity<br><span>Quiz.</span></h1>
<p>18 focused exam-style questions with instant feedback and concise explanations.</p>
</div>
<div class="hero-mark" aria-hidden="true">CL</div>
</div>
</section>

<section id="app-section">
<div id="app" class="card"></div>
</section>

<footer class="footer"><b>Dr Mohammed Badawy</b>DR BADAWY ACADEMY · PEDIATRICS · Interactive Learning</footer>

</main>
</div></div>
<script>
function theme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('dbp_theme',t);}catch(e){}
  const btn=document.getElementById('themeBtn');
  btn.textContent=t==='dark'?'☀️ Light':'🌙 Dark';
  document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F');
}
let savedTheme='light';
try{savedTheme=localStorage.getItem('dbp_theme')||(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
theme(savedTheme);
document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ---- Progress persistence (shared with index.html via localStorage) ---- */
const QUIZ_ID='neonatology-classification-dysmaturity-postmaturity-quiz';
const PROGRESS_KEY='dbp_quizProgress';
function getQuizProgress(){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    return all[QUIZ_ID]||{};
  }catch(e){return {};}
}
function saveQuizProgress(sectionIdx,score,total){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    if(!all[QUIZ_ID])all[QUIZ_ID]={};
    const pct=Math.round(score/total*100);
    const prev=all[QUIZ_ID][sectionIdx];
    all[QUIZ_ID][sectionIdx]={done:true,score,total,pct:(prev&&prev.pct>pct)?prev.pct:pct};
    localStorage.setItem(PROGRESS_KEY,JSON.stringify(all));
  }catch(e){}
}

const SECTIONS = [{"en":"Classification, Dysmaturity & Postmaturity","icon":"CL","q":[{"en":"A pregnant woman delivered a 44 weeks gestational age baby with the following character:","opts":["Closed eye","Meconium stained","Short hair","Short nail"],"ans":1,"exp":"Postmaturity is associated with placental insufficiency and fetal stress, so meconium staining is common."},{"en":"Mother was delivered a 40 weeks neonate; the following treatment was given to this baby to prevent bleeding.","opts":["Adrenaline","Gentamycin","Konakion","Paracetamol"],"ans":2,"exp":"Newborn vitamin K stores are low; prophylactic vitamin K (Konakion) prevents vitamin-K-deficiency bleeding."},{"en":"A mother delivered a post term baby who defined as baby delivered after ...... week's gestational age.","opts":["40","41","42","43"],"ans":2,"exp":"Post-term/postmature birth is defined after 42 completed weeks of gestation."},{"en":"Caesarian section was done for baby then gestational age was determined by ossification centers. The normal time of appearance of ossification centers of Lower end of femur & upper end of tibia is:","opts":["6 months of pregnancy","7 months of pregnancy","8 months of pregnancy","9 months of pregnancy"],"ans":3,"exp":"The keyed answer is 9 months of pregnancy. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"A pregnant woman delivered a small for gestational age baby with the following complication:","opts":["Hypercalcemia","Hyperglycemia","Hyperthermia","Hypoxia"],"ans":3,"exp":"Placental insufficiency and chronic fetal compromise make SGA infants vulnerable to hypoxia/asphyxia."},{"en":"Pregnant female delivered preterm baby . The preterm bay is defined as baby delivered before","opts":["34 week .","35 week","36 week .","37 week","38 week"],"ans":3,"exp":"Prematurity is birth before 37 completed weeks of gestation."},{"en":"Emergency Caesarian sectionon for women with eclampsia The baby delivered with weight <10th centile of expected from his gestational age . The following complication can occur in this baby :","opts":["Hypercalcemia .","Hypermagnesemia","Hypokalemia .","Hyponatremia .","Hypothermia ."],"ans":4,"exp":"SGA infants have little subcutaneous fat and limited energy reserves, predisposing them to hypothermia."},{"en":"A 30 years old woman was delivered a baby 44 weeks gestational age. The following is not manifestation of this condition","opts":["Active .","Alert .","Meconium stained .","Rough wrinkled skin .","Short nail ."],"ans":4,"exp":"Post-term infants characteristically have long nails; short nails therefore do not fit postmaturity."},{"en":"Meconium aspiration occurs more in :","opts":["Extremely preterm .","Near term .","Full term .","Preterm .","Post term"],"ans":4,"exp":"The keyed answer is Post term. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"Baby is considered Post mature if gestational age:","opts":["more than 38 weeks","more than 44 weeks","more than 42 weeks","more than 37 weeks"],"ans":2,"exp":"Post-term/postmature birth is defined after 42 completed weeks of gestation."},{"en":"15-A pregnant woman delivered a small for gestational age baby. The following is not character of this condition:","opts":["Absent subcutaneous fate.","Loose skin.","Low temperature.","Muscle wasting.","Wet skin."],"ans":4,"exp":"SGA/dysmature infants tend to have reduced subcutaneous fat and loose, dry or wrinkled skin; wet skin is not typical."},{"en":"Post maturity is not associated with the following:","opts":["Meconium stain","Loose skin","Short nails","Skin desquamation"],"ans":2,"exp":"Post-term infants characteristically have long nails; short nails therefore do not fit postmaturity."},{"en":"A very low birth weight infant is an infant with birth weight of","opts":["2-2.5 kg","<2 kg","< 1.5 kg","< 1 kg"],"ans":2,"exp":"Very low birth weight is defined as birth weight below 1.5 kg (1500 g)."},{"en":"The following are recognized complienations in a post term baby EXCEPT: Another form: The following are recognized complications in a post term baby except: A. Birth asphyxia. B. Hypoglycemia. C. Hyaline membrane disease. D. Pulmonary hemorrhage. E. Meconium aspiration.","opts":["Birth asphyxia.","Hypoglycema.","Hyaline membrane disease.","Hypocalcemia"],"ans":2,"exp":"Hyaline membrane disease is primarily a disease of prematurity due to surfactant deficiency, not a typical post-term complication."},{"en":"Very low birth weight infant is an infant with birth weight of: Another form: Very low birth weight baby (VLBW) is an infant whose weight at birth is: A. < 1000 gm B. <1500gm C. <2000gm D. <2500gm","opts":["1800 gm or less","1500 gm or less","1000 gm or less","<2000gm"],"ans":1,"exp":"Very low birth weight is defined as birth weight below 1.5 kg (1500 g)."},{"en":"A full-term baby is delivered ..... weeks' gestation","opts":["32","34","36","38"],"ans":3,"exp":"The keyed answer is 38. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"Small-for-gestational-age infants are more likely than appropriate-for-gestational-age infants to have all except:","opts":["Birth asphyxia","Hypocalcemia.","Meconium aspiration","Hyperglycemia"],"ans":3,"exp":"The keyed answer is Hyperglycemia. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."},{"en":"A light-for-dates full-term baby is at particular risk from the following conditions:","opts":["Hyaline membrane disease.","Physiological jaundice.","Milk aspiration.","Hypoglycemia.","Apneic attacks."],"ans":3,"exp":"SGA infants have limited glycogen and fat reserves, making hypoglycemia a major risk."}]}];

let curSection=null, i=0, score=0, answered=false, missed=[];
const app=document.getElementById('app');

function home(){
  curSection=null;
  const prog=getQuizProgress();
  let html='<div class="eyebrow">Choose a section</div><div class="sec-grid">';
  SECTIONS.forEach((s,idx)=>{
    const done=prog[idx]&&prog[idx].done;
    html+=`<div class="sec-card" onclick="startSection(${idx})">
      <div class="sec-top"><div class="sec-icon">${s.icon}</div><span class="sec-status${done?' done':''}">${done?'Completed · '+prog[idx].pct+'%':'Not started'}</span></div>
      <div class="sec-title">${s.en}</div>
      <div class="sec-count">${s.q.length} Questions</div>
    </div>`;
  });
  html+='</div><div class="intro-note">Pick a section to start its interactive quiz. Your progress is saved automatically on this device.</div>';
  app.innerHTML=html;
}

function startSection(idx){
  curSection=idx; i=0; score=0; missed=[];
  render();
}

function render(){
  const sec=SECTIONS[curSection], q=sec.q[i], pct=Math.round(i/sec.q.length*100);
  app.innerHTML=`<div class="topline">
    <div><div class="eyebrow">Score</div><div class="score-num">${score}<span> / ${sec.q.length}</span></div></div>
    <div class="topline-right">
      <div class="sec-label">${sec.en.toUpperCase()}</div>
      <div class="qcount">Question ${String(i+1).padStart(2,'0')} of ${sec.q.length}</div>
      <button class="back-link" onclick="home()">‹ Back to sections</button>
    </div>
  </div>
  <div class="progress-bar"><i style="width:${pct}%"></i></div>
  <div class="qbox">
    <div class="qwatermark">${String(i+1).padStart(2,'0')}</div>
    <div class="question-en">${q.en}</div>
  </div>
  <div class="choices">${q.opts.map((x,n)=>`<button class="choice" onclick="choose(${n})"><span class="badge">${String.fromCharCode(65+n)}</span><span>${x}</span></button>`).join('')}</div>
  <div id="feedback" class="feedback"></div>
  <div class="actions"><span class="hint">Choose one answer, then click Next</span><button id="next" class="btn next" disabled onclick="nextQ()">Next →</button></div>`;
  answered=false;
}

function choose(n){
  if(answered)return;
  answered=true;
  const sec=SECTIONS[curSection], q=sec.q[i], buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach(b=>b.disabled=true);
  buttons[q.ans].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(n===q.ans){
    score++;
    fb.className='feedback show good';
    fb.innerHTML=`<b>Correct!</b><div class="explain">${q.exp}</div>`;
  }else{
    buttons[n].classList.add('wrong');
    missed.push({num:i+1,en:q.en,correct:q.opts[q.ans]});
    fb.className='feedback show bad';
    fb.innerHTML=`<b>Not quite.</b><div class="explain">Correct answer: ${q.opts[q.ans]}<br>${q.exp}</div>`;
  }
  document.getElementById('next').disabled=false;
  document.querySelector('.score-num').innerHTML=`${score}<span> / ${sec.q.length}</span>`;
}

function nextQ(){
  const sec=SECTIONS[curSection];
  if(i<sec.q.length-1){i++;render()}else{result()}
}

function result(){
  const sec=SECTIONS[curSection], pct=Math.round(score/sec.q.length*100);
  saveQuizProgress(curSection,score,sec.q.length);
  let msg=pct>=85?'Excellent review.':pct>=65?'Solid work — revisit the points you missed.':'Review the summary again, then retake the quiz.';
  app.innerHTML=`<div class="result">
    <span class="eyebrow">Final Result · ${sec.en}</span>
    <div class="score-big">${score}/${sec.q.length}</div>
    <h2>${pct}%</h2>
    <p>${msg}</p>
    ${missed.length?`<div class="review"><b>Review points</b>${missed.map(x=>`<div><span class="tag">Q${x.num}</span> ${x.en}<br><small>Correct: <b>${x.correct}</b></small></div>`).join('')}</div>`:'<p>All correct. Well done!</p>'}
    <div class="result-actions">
      <button class="btn restart" onclick="startSection(${curSection})">Retry section</button>
      <button class="btn ghost" onclick="home()">Other sections</button>
    </div>
  </div>`;
}

home();
</script>

<script src="../assets/firebase-config-dbp.js"></script>
<script type="module" src="../assets/dbp-auth.js"></script>
</body>
