<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Neonatal Resuscitation &amp; Perinatal Asphyxia — Dr Badawy Academy</title><meta name="theme-color" content="#16324F" id="themeColorMeta"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#F6F8F8;--surface:#FFF;--surface2:#FBFCFC;--ink:#17233F;--soft:#2B3650;--muted:#71808B;--faint:#9AA5AE;--line:#E3E9EA;--gold:#B8892B;--gold2:#E8BD5B;--goldbg:#FFF8E8;--teal:#178F8C;--tealbg:#EAF7F5;--red:#B23B3B;--green:#26865A;--shadow:0 12px 34px rgba(24,46,65,.07);--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}[data-theme=dark]{--bg:#10141B;--surface:#191D26;--surface2:#1F242F;--ink:#EDF0F4;--soft:#D7DCE5;--muted:#98A3B5;--faint:#707B8C;--line:#2B313B;--gold:#E6B955;--gold2:#E6B955;--goldbg:#2E2715;--teal:#54C5B2;--tealbg:#142925;--green:#62C993;--red:#EF7C7C}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}a{text-decoration:none;color:inherit}.shell{max-width:920px;margin:auto;padding:0 20px 70px}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:#10283E;font-weight:900}.brand b{font-family:var(--serif)}.brand small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.08em}.top-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}.hero{border-radius:26px;background:linear-gradient(118deg,#1D294C,#55376F 65%,#9A507C 150%);padding:34px 38px;color:white;box-shadow:var(--shadow)}.kicker{font-size:10px;font-weight:800;letter-spacing:.15em;color:#F3C6E0}.hero h1{font-family:var(--serif);font-size:clamp(34px,6vw,56px);line-height:1;margin:10px 0 12px}.hero p{margin:0;color:rgba(255,255,255,.78);font-size:13px;line-height:1.65}.quiz-card{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:14px}.question{font-size:20px;line-height:1.55;font-weight:800}.qimg{display:block;max-width:320px;width:100%;margin:16px auto;border-radius:14px;border:1px solid var(--line)}.options{display:grid;gap:10px;margin-top:20px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:13px;padding:13px 14px;cursor:pointer;font-size:14px;line-height:1.45}.opt:hover{border-color:var(--teal)}.opt.correct{border-color:var(--green);background:rgba(38,134,90,.09)}.opt.wrong{border-color:var(--red);background:rgba(178,59,59,.09)}.explain{display:none;margin-top:17px;border-left:4px solid var(--gold);background:var(--goldbg);border-radius:10px;padding:14px 15px;font-size:13px;line-height:1.65}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--teal);color:white}.btn.secondary{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:default}.result{display:none;text-align:center;padding:16px}.score{font-family:var(--serif);font-size:48px;margin:8px 0}.footer{text-align:center;padding-top:30px;color:var(--faint);font-size:10px}@media(max-width:600px){.shell{padding:0 14px 60px}.hero{padding:25px 20px}.quiz-card{padding:18px}.question{font-size:18px}.actions{flex-direction:column}.btn{width:100%}}
</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="neonatology-quiz.html"><div class="logo">MB</div><div><b>Dr Badawy Academy</b><small>PEDIATRICS · NEONATOLOGY</small></div></a><button class="top-btn" id="themeBtn">🌙 Dark</button></header><main><section class="hero"><div class="kicker">NEONATOLOGY · FINAL MCQs</div><h1>Neonatal Resuscitation &amp; Perinatal Asphyxia</h1><p>24 exam-style questions with instant correction and concise explanations.</p></section><section class="quiz-card"><div id="quizView"><div class="meta"><span id="progress"></span><span id="scoreLive">Score 0</span></div><div class="question" id="question"></div><img id="qimg" class="qimg" hidden><div class="options" id="options"></div><div class="explain" id="explain"></div><div class="actions"><button class="btn secondary" id="prevBtn">← Previous</button><button class="btn" id="nextBtn" disabled>Next →</button></div></div><div class="result" id="result"><div>Quiz complete</div><div class="score" id="finalScore"></div><p id="finalText"></p><button class="btn" onclick="restartQuiz()">Try Again</button></div></section></main><footer class="footer">DR BADAWY ACADEMY · PEDIATRICS · Interactive Learning</footer></div><script>
const QUIZ_ID="neonatology-resuscitation-asphyxia-quiz"; const PROGRESS_KEY='dbp_quizProgress'; const QUESTIONS=[{"num": 1, "q": "Emergency Caesarian section was done for full term baby who is comatose, flaccid, absent neonatal reflexes, uncontrollable convulsion and fixed pupil. What is the prognosis in this case?", "options": ["Cannot be predicted", "Good", "Poor", "Variable"], "answer": 2, "explanation": "The keyed answer is Poor. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 2, "q": "During neonatal resuscitation if diaphragmatic hernia was diagnosed antenatal the best to do positive pressure ventilation by:", "options": ["Endotracheal intubation", "Mask ventilation", "Nasal prong", "Umbo bag"], "answer": 0, "explanation": "Bag-mask ventilation can distend the stomach and worsen lung compression in congenital diaphragmatic hernia; secure the airway with endotracheal intubation instead."}, {"num": 3, "q": "After resuscitation of full term neonate. The nurse record the AGAR score of acrocyanosis only, pulse > 100, Grimace, some flexion and slow - irregular respiration of this baby. Her correct record was:", "options": ["3", "4", "5", "6"], "answer": 3, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives 6."}, {"num": 4, "q": "After resuscitation of full term neonate. The nurse record the AGARscore of blue - pale, pulse > 100, Grimace, some flexion and slow -irregular respiration of this baby. Her correct record was", "options": ["3", "4", "5", "6"], "answer": 2, "explanation": "The keyed answer is 5. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 5, "q": "After resuscitation of full term neonate. The nurse record the APGAR score of blue - pale, Slow pulse < 100, Grimace, some flexion and slow - irregular respiration of this baby. Her correct record was: (Mid)", "options": ["3", "4", "5", "6"], "answer": 1, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives 4."}, {"num": 6, "q": "Simple measures to induce Spontaneous respiration during neonatal resuscitation by:", "options": ["Rubbing chest", "Rubbing head", "Rubbing neck", "Rubbing Sole"], "answer": 3, "explanation": "Tactile stimulation is performed by rubbing the back or flicking/rubbing the soles; the keyed site is an accepted stimulation site."}, {"num": 7, "q": "During neonatal resuscitation the doctor made the following mistake:", "options": ["Deep suction", "Dry baby", "Suction (Mouth → Nose)", "Warm baby"], "answer": 0, "explanation": "Deep or aggressive suction is avoided because it may cause vagal stimulation, bradycardia and mucosal trauma."}, {"num": 8, "q": "A pregnant mother was delivered a baby diagnosed as hypoxic ischemic encephalopathy. The following is the best and specific management for this case:", "options": ["Blood transfusion.", "Hyperthermia.", "Hypothermia.", "Normothermia.", "Prednisolone."], "answer": 2, "explanation": "Therapeutic hypothermia is the specific neuroprotective treatment used for eligible neonates with hypoxic-ischemic encephalopathy."}, {"num": 9, "q": "The following are correct order of steps of resuscitation:", "options": ["Dry, suction and warm.", "Dry, warm and suction", "Suction, dry and warm.", "Warm, dry and suction", "Warm, suction and Dry."], "answer": 1, "explanation": "The initial sequence emphasizes drying and warming, then airway clearing when indicated; among the listed options, this corresponds to the keyed sequence."}, {"num": 10, "q": "Preterm male baby 32 weeks gestational age was delivered by caesarian section. During resuscitation he developed apnea The following site was rubbed to stimulate respiration:", "options": ["Abdomen.", "Arm.", "Back.", "Chest.", "Head."], "answer": 2, "explanation": "Tactile stimulation is performed by rubbing the back or flicking/rubbing the soles; the keyed site is an accepted stimulation site."}, {"num": 11, "q": "A term baby is delivered after prolonged obstructed labor. Immediately after birth, the baby is pale, with no respiratory effort, no heartbeat on auscultation, no movement, and no response to stimulation. . ‫ اﻟﻤٮﺪ ﰷن إﻟﻜ &ٮروٮ‬", "options": ["‫ اﻟﻜٮ*ﺲ ﻣ &ٮﺄﻟڡ\" ﺔ‬،‫\"ى‬", "0", "1", "2", "3"], "answer": 0, "explanation": "The keyed answer is ‫ اﻟﻜٮ*ﺲ ﻣ &ٮﺄﻟڡ\" ﺔ‬،‫\"ى‬. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 12, "q": "After resuscitation of full term neonate. The nurse record the AGAR score of blue - pale, pulse = 120, Grimace, some flexion and slow - irregular respiration of this baby. Her correct record was:", "options": ["3", "4", "5", "6", "7"], "answer": 2, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives 5."}, {"num": 13, "q": "A neonatologist attends resuscitation of full term baby and do the following correct steps of resuscitation in correct order:", "options": ["Dry, suction and warm.", "Dry, warm and suction", "Suction, dry and warm.", "Warm, dry and suction", "Warm, suction and Dry."], "answer": 1, "explanation": "The initial sequence emphasizes drying and warming, then airway clearing when indicated; among the listed options, this corresponds to the keyed sequence."}, {"num": 14, "q": "An infant at birth exhibits pink body with blue extremities, pulse rate of 120/min, Limp muscle tone, slow irregular respiration, & grimace. The Apgar score is:", "options": ["2", "4", "5", "7"], "answer": 2, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives 5."}, {"num": 15, "q": "Which of the following drugs is not used in resuscitation of the newborn:", "options": ["NAHCO3", "Naloxone", "KCL", "Adrenaline"], "answer": 2, "explanation": "Potassium chloride is not a neonatal resuscitation drug; it can precipitate dangerous arrhythmias and cardiac arrest."}, {"num": 16, "q": "A newborn with HR of 90/min, crying, body pink, limbs blue, limp & grimace response on stimulation. The Apgar Score is:", "options": ["3", "5", "7", "9"], "answer": 1, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives 5."}, {"num": 17, "q": "Which of the following is not a character of Saranat stage I in case of hypoxic ischemic encephalopathy?", "options": ["Irritability", "Normal tone", "Convulsions", "Mild to moderate hyperreflexia"], "answer": 2, "explanation": "Stage I HIE is the mild stage; seizures/convulsions are not a typical Stage I feature and suggest more advanced encephalopathy."}, {"num": 18, "q": "An infant at birth exhibits pink body with blue limbs, pulse rate of 80/min, limp muscle tone, slow irregular respiration, & grimace. The Apgar score is:", "options": ["2", "4", "5", "7"], "answer": 1, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives 4."}, {"num": 19, "q": "Naloxone is an:", "options": ["A. Opiate antagonist", "B. Noradrenaline antagonist", "C. Analgesic paracetamol antagonist", "D. All are correct"], "answer": 0, "explanation": "Naloxone is an opioid (opiate) receptor antagonist; it reverses opioid effects rather than acting as a catecholamine antagonist."}, {"num": 20, "q": "Whenever Apgar is > 7 ............s (are) needed?", "options": ["A. Further resuscitation", "B. O2 by bag & mask", "C. A+B", "D. Normal neonatal care"], "answer": 3, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives D. Normal neonatal care."}, {"num": 21, "q": "A newborn infant exhibits heart rate of 95/min, crying, coughing, limp and pink color. The Apgar score is:", "options": ["3", "5", "7", "9"], "answer": 2, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives 7."}, {"num": 22, "q": "All the following are true regarding stage II SARNAT staging for hypoxic ischemic encephalopathy except", "options": ["Lethargy", "Hypotonic child", "Exaggerated reflexes", "Seizure is common"], "answer": 2, "explanation": "Sarnat stage II is characterized by lethargy, hypotonia, weak reflexes and seizures; exaggerated reflexes do not fit the stage II pattern."}, {"num": 23, "q": "Apgar score is done at birth:", "options": ["A. After 1 min", "B. At 5 min", "C. After 20 min", "D. a& b"], "answer": 3, "explanation": "Apgar is the sum of Appearance, Pulse, Grimace, Activity and Respiration (0–2 each). Adding the findings in the stem gives D. a& b."}, {"num": 24, "q": "Ambu-bag ventilation is better avoided in the following condition:", "options": ["Respiratory distress syndrome", "Meconium aspiration", "Diaphragmatic hernia", "Transient tachypnea of newborn"], "answer": 2, "explanation": "The keyed answer is Diaphragmatic hernia. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}]; let idx=0,score=0,answers=Array(QUESTIONS.length).fill(null);
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const q=QUESTIONS[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${QUESTIONS.length}`;document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('question').textContent=q.q;const img=document.getElementById('qimg');if(q.image){img.src=q.image;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')};const box=document.getElementById('options');box.innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');const exp=document.getElementById('explain');exp.style.display='none';exp.innerHTML='';document.getElementById('nextBtn').disabled=answers[idx]===null;document.getElementById('prevBtn').disabled=idx===0;box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));if(answers[idx]!==null)showAnswered()}
function choose(i){if(answers[idx]!==null)return;answers[idx]=i;if(i===QUESTIONS[idx].answer)score++;showAnswered();document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('nextBtn').disabled=false}
function showAnswered(){const q=QUESTIONS[idx],chosen=answers[idx];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===chosen&&i!==q.answer)b.classList.add('wrong')});const e=document.getElementById('explain');e.innerHTML=`<b>Explanation</b><br>${esc(q.explanation)}`;e.style.display='block'}
document.getElementById('nextBtn').onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render()}else finish()};document.getElementById('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};
function finish(){document.getElementById('quizView').style.display='none';document.getElementById('result').style.display='block';const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('finalScore').textContent=`${score} / ${QUESTIONS.length}`;document.getElementById('finalText').textContent=`${pct}%`;try{const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');all[QUIZ_ID]={0:{done:true,score,total:QUESTIONS.length,pct}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(all))}catch(e){}}
function restartQuiz(){idx=0;score=0;answers=Array(QUESTIONS.length).fill(null);document.getElementById('quizView').style.display='block';document.getElementById('result').style.display='none';render()}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('dbp_theme',t)}catch(e){};document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light':'🌙 Dark';document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F')}let saved='light';try{saved=localStorage.getItem('dbp_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}theme(saved);document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');render();
</script></body></html>
