--muted);font-size:11px;font-weight:700;margin-bottom:14px}.question{font-size:20px;line-height:1.55;font-weight:800}.qimg{display:block;max-width:320px;width:100%;margin:16px auto;border-radius:14px;border:1px solid var(--line)}.options{display:grid;gap:10px;margin-top:20px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:13px;padding:13px 14px;cursor:pointer;font-size:14px;line-height:1.45}.opt:hover{border-color:var(--teal)}.opt.correct{border-color:var(--green);background:rgba(38,134,90,.09)}.opt.wrong{border-color:var(--red);background:rgba(178,59,59,.09)}.explain{display:none;margin-top:17px;border-left:4px solid var(--gold);background:var(--goldbg);border-radius:10px;padding:14px 15px;font-size:13px;line-height:1.65}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--teal);color:white}.btn.secondary{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:default}.result{display:none;text-align:center;padding:16px}.score{font-family:var(--serif);font-size:48px;margin:8px 0}.footer{text-align:center;padding-top:30px;color:var(--faint);font-size:10px}@media(max-width:600px){.shell{padding:0 14px 60px}.hero{padding:25px 20px}.quiz-card{padding:18px}.question{font-size:18px}.actions{flex-direction:column}.btn{width:100%}}
</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="neonatology-quiz.html"><div class="logo">MB</div><div><b>Dr Badawy Academy</b><small>PEDIATRICS · NEONATOLOGY</small></div></a><button class="top-btn" id="themeBtn">🌙 Dark</button></header><main><section class="hero"><div class="kicker">NEONATOLOGY · FINAL MCQs</div><h1>Birth Injuries</h1><p>42 exam-style questions with instant correction and concise explanations.</p></section><section class="quiz-card"><div id="quizView"><div class="meta"><span id="progress"></span><span id="scoreLive">Score 0</span></div><div class="question" id="question"></div><img id="qimg" class="qimg" hidden><div class="options" id="options"></div><div class="explain" id="explain"></div><div class="actions"><button class="btn secondary" id="prevBtn">← Previous</button><button class="btn" id="nextBtn" disabled>Next →</button></div></div><div class="result" id="result"><div>Quiz complete</div><div class="score" id="finalScore"></div><p id="finalText"></p><button class="btn" onclick="restartQuiz()">Try Again</button></div></section></main><footer class="footer">DR BADAWY ACADEMY · PEDIATRICS · Interactive Learning</footer></div><script>
const QUIZ_ID="neonatology-birth-injuries-quiz"; const PROGRESS_KEY='dbp_quizProgress'; const QUESTIONS=[{"num": 1, "q": "Emergency Caesarian section was done for baby delivered with irregular shallow breathing, apnea, absent reflexes and convulsion. The following is the cause of this condition:", "options": ["Bilateral choanal atresia", "Congenital pneumonia", "Intracranial hemorrhage", "Pleural effusion"], "answer": 2, "explanation": "The keyed answer is Intracranial hemorrhage. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 2, "q": "The following is a risk factor of birth injuries.", "options": ["Birth weight of 3 Kg", "Cephalic presentation", "Contracted pelvis", "Normohydramnio"], "answer": 2, "explanation": "A contracted pelvis increases the likelihood of difficult/obstructed labor and therefore birth trauma."}, {"num": 3, "q": "The following is a character of Cephal-hematoma.", "options": ["Associated with Skin ecchymosis", "Diffuse (Cross Suture line)", "Occur soon at birth", "Sub-periosteal blood collection"], "answer": 3, "explanation": "Cephalhematoma is a subperiosteal blood collection, so it is limited by suture lines."}, {"num": 4, "q": "Type of Intracranial hemorrhage includes the following:", "options": ["Caput succedaneum", "Cephalhematoma", "Sub Arachnoid Hemorrhage", "Sub-galial hematomage"], "answer": 2, "explanation": "The keyed answer is Sub Arachnoid Hemorrhage. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 5, "q": "The following is a character of facial nerve injury.", "options": ["Absent nasolabial fold on same side", "Close eye firmly", "Deviation of angle of mouth to diseased side", "Symmetric cry"], "answer": 0, "explanation": "Peripheral facial nerve palsy causes ipsilateral facial weakness, loss of the nasolabial fold and impaired eye closure, with the mouth pulled toward the healthy side."}, {"num": 6, "q": "The following is a character of Caput succedaneum.", "options": ["Any bone (Parietal & occipital)", "Few hours after birth", "Localized", "Soft"], "answer": 3, "explanation": "Caput succedaneum is soft subcutaneous edema present at birth and can cross suture lines."}, {"num": 7, "q": "Correction of C5,6 root injury by putting the hand in:", "options": ["Claw hand posture", "Hand writing position", "Statue of liberty splint", "Waiter's tip posture"], "answer": 2, "explanation": "Erb palsy (C5–C6) is positioned in abduction and external rotation—the classic Statue of Liberty splint position—to oppose the deformity."}, {"num": 8, "q": "The following is a character of Sub-galial hematoma.", "options": ["Localized", "Occur soon at birth", "Spread from orbital ridges to occiput", "Sub-periosteal blood collection"], "answer": 2, "explanation": "Subgaleal hemorrhage spreads widely in the potential space beneath the galea, extending across sutures from the orbital region toward the occiput."}, {"num": 9, "q": "The most common bone to be fractured in birth injury: (Final Zag 53)", "options": ["Humerus", "Femur", "Clavicle", "Neck bones", "Ulna"], "answer": 2, "explanation": "The clavicle is the most commonly fractured bone during birth trauma."}, {"num": 10, "q": "Emergency Caesarian section was done for baby delivered with irregular shallow breathing, apnea, absent reflexes and convulsion. The following is the cause of this condition:", "options": ["Bilateral choanal atresia", "Intracranial hemorrhage", "Pleural effusion", "Pneumothorax"], "answer": 1, "explanation": "The keyed answer is Intracranial hemorrhage. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 11, "q": "A pregnant woman was delivered a baby with sub-periostealblood collection. The following is the other criteria of this condition:", "options": ["Affect any bone", "Diffuse over skul", "Soft in consistency", "Spontaneous resolved", "Usually no complications"], "answer": 0, "explanation": "A subperiosteal collection is a cephalhematoma; because periosteum is attached at sutures, it remains localized to one bone."}, {"num": 12, "q": "A pregnant mother was delivered a baby with a waiter's tip posture The following is the management for this case:", "options": ["Avoid nerve repair", "Cotton in fist", "Figure of eight", "Hand writing position", "Statue of liberty splint"], "answer": 4, "explanation": "Erb palsy (C5–C6) is positioned in abduction and external rotation—the classic Statue of Liberty splint position—to oppose the deformity."}, {"num": 13, "q": "What’s your diagnosis (OSPE 52‫&ﺄﻟڡﺔ‬ \" ‫ﻌﺔ ﻣٮ‬+) ‫ )اﻟﺼٮ‬", "options": ["Cephalhematoma", "Sub galial hematoma", "Caput succedaneum", "ICH"], "answer": 0, "image": "assets/cephalhematoma.png", "explanation": "The keyed answer is Cephalhematoma. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 14, "q": "What is the suspected nerve injury? (OSPE 52‫&ﺄﻟڡﺔ‬ \" ‫ﻌﺔ ﻣٮ‬+) ‫ )اﻟﺼٮ‬", "options": ["Facial nerve", "‫ ﻣﺶ‬facial nerve", "Not facial nerve", "‫ﺪ ﻣﺶ‬$‫ أﻛٮ‬facial nerve"], "answer": 0, "image": "assets/facial-nerve.png", "explanation": "Peripheral facial nerve palsy causes ipsilateral facial weakness, loss of the nasolabial fold and impaired eye closure, with the mouth pulled toward the healthy side."}, {"num": 15, "q": "The photo shows waiter’s tip posture, what is the suspected diagnosis: (OSPE 52‫&ﺄﻟڡﺔ‬ \" ‫ﻌﺔ ﻣٮ‬+) ‫ )اﻟﺼٮ‬", "options": ["Erb’s palsy", "Klump’s palsy", "Entire nerve injury", "Claw hand"], "answer": 0, "explanation": "The keyed answer is Erb’s palsy. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 16, "q": "The photo shows waiter’s tip posture,the limb is placed in which position (OSPE 52‫&ﺄﻟڡﺔ‬ \" ‫ﻌﺔ ﻣٮ‬+) ‫ )اﻟﺼٮ‬", "options": ["Policeman's tip position", "Claw hand", "Flaccid", "Ape hand"], "answer": 0, "explanation": "The keyed answer is Policeman's tip position. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 17, "q": "A 3-week-old baby presented with a mass in the right side of his neck. There is no erythema, on palpation it is firm non-tender and seems to be located within the muscle with tilting of the head to the same side and rotation of the face to the opposite side, What muscle is most likely responsible for the baby's abnormal range of movement and head posture", "options": ["Digastric", "Platysma", "Trapezius", "Sternocleidomastoid", "Masseter"], "answer": 3, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 18, "q": "A 3-week-old baby presented with a mass in the right side of his neck.There is no erythema, on palpation it is firm non-tender and seems to belocated within the muscle with tilting of the head to the same side androtation of the face to the opposite side,The diagnos is", "options": ["Cystic hygroma", "Torticollis", "Cervical lymphadenitis", "Thyroglossal duct cyst", "Bronchial cleft cyst"], "answer": 1, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 19, "q": "A 3-week-old baby presented with a mass in the right side of his neck.There is no erythema, on palpation it is firm non-tender and seems to belocated within the muscle with tilting of the head to the same side androtation of the face to the opposite side, The Optimal management is", "options": ["Biopsy, frozen section, excision", "Biopsy without frozen section", "Division of the sternocleidomastoid muscle", "Ultrasound, watchful waiting", "Stretching and range of motion exercises"], "answer": 4, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 20, "q": "This is CT scan on the brain of full-term baby with intra cranial hemorrhage delivered by normal vaginal delivery, The risk factor for this case doesn’t include:", "options": ["Prematurity", "Macrosomia", "Instrumental delivery", "Elective cesarian section"], "answer": 3, "explanation": "The keyed answer is Elective cesarian section. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 21, "q": "This is CT scan on the brain of full-term baby with intra cranial hemorrhage delivered by normal vaginal delivery,The last investigation to be carried out into such a case is", "options": ["CBC", "PT and PTT", "Lumber puncture", "CT and MRI brain"], "answer": 2, "explanation": "Lumbar puncture is avoided/left until last in suspected neonatal intracranial hemorrhage because imaging and safer laboratory tests should be used first."}, {"num": 22, "q": "This is CT scan on the brain of full-term baby with intra cranial hemorrhage delivered by normal vaginal delivery,One of the following lines of treatment is controversy to be given", "options": ["IV vitamin K", "Plasma and/or platelet transfusion", "IV Mannitol", "Anticonvulsants if there are convulsions"], "answer": 2, "explanation": "Osmotic brain-dehydrating therapy such as IV mannitol is controversial in neonatal intracranial hemorrhage."}, {"num": 23, "q": "Following a difficult labor, a unilateral Moro reflex is a sign of:", "options": ["Prematurity", "Fractured clavicle", "Cephalhematoma", "Facial palsy"], "answer": 1, "explanation": "The clavicle is the most commonly fractured bone during birth trauma."}, {"num": 24, "q": "Caput succedancum is characterized by the folowing EXCEPT:", "options": ["Sweling crosses, the middle line", "Appears immediately after birth", "Complications are rare", "Presence of pulsation"], "answer": 3, "explanation": "Caput succedaneum is nonpulsatile soft edema; pulsation is not a typical feature."}, {"num": 25, "q": "All of the following are considered birth injuries EXCEPT:", "options": ["Fracture clavicle", "Diaphragmatic hernia", "Erb's palsy", "Cephalhematoma"], "answer": 1, "explanation": "Diaphragmatic hernia is a congenital malformation, whereas clavicular fracture, Erb palsy and cephalhematoma are birth injuries."}, {"num": 26, "q": "Treatment of cephalhematoma is:", "options": ["Needle aspiration", "Antibiotics", "Incision & drainage", "None of the above"], "answer": 3, "explanation": "Uncomplicated cephalhematoma is managed conservatively; aspiration, incision and routine antibiotics are avoided because they can introduce infection."}, {"num": 27, "q": "The bone most frequently involved in cephalhematomas is:", "options": ["Parietal", "Temporal", "Occipital", "Frontal"], "answer": 0, "explanation": "Cephalhematoma most often overlies a parietal bone because it is confined beneath the periosteum of one skull bone."}, {"num": 28, "q": "Regarding to birth injuries, which is true:", "options": ["Caput succedaneum needs syringe aspiration", "Bloody CSF is diagnostic for intracranial hemorrhage", "Erb's palsy occurs due to damage of C3, C4, C5", "Clavicle is the most commonly bone liable for fracture"], "answer": 3, "explanation": "The keyed answer is Clavicle is the most commonly bone liable for fracture. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 29, "q": "Regarding Erb's palsy which is false:", "options": ["There is preserved grasp reflex", "May lead to wasting of the arm", "Affects the small muscles of the hand", "Is common after breech delivery", "May be due to injury of the upper brachial plexus"], "answer": 2, "explanation": "Small hand muscles are mainly supplied by the lower brachial plexus (C8–T1), so this is not a feature of Erb palsy (C5–C6)."}, {"num": 30, "q": "Considering cephalhematoma which statement is false:", "options": ["Swelling crosses, the suture lines", "Not present at birth", "Needs weeks to disappear", "Mav need treatment if there is anemia or jaundice"], "answer": 0, "explanation": "Cephalhematoma is subperiosteal and therefore does not cross suture lines; crossing sutures suggests caput or subgaleal hemorrhage."}, {"num": 31, "q": "All the followings are considered risk factors of birth injuries EXCEPT:", "options": ["Large sized baby (Macrosomia)", "Cephalic normal presentations", "Instrumental delivery", "Prolonged or obstructed labor"], "answer": 1, "explanation": "Diaphragmatic hernia is a congenital malformation, whereas clavicular fracture, Erb palsy and cephalhematoma are birth injuries."}, {"num": 32, "q": "Erb's palsy is due to injury of the following cervical nerves:", "options": ["Cl and C2", "C3 and C4", "C5 and C6", "C7 and C8"], "answer": 2, "explanation": "Erb palsy results from injury to the upper brachial plexus, classically C5 and C6 roots."}, {"num": 33, "q": "Klump's paralysis is due to injury of the following cranial nerves:", "options": ["Cl and C2", "C3 and C4", "C5 and C6", "C7, C8 and T1"], "answer": 3, "explanation": "Klumpke palsy involves the lower brachial plexus, classically C8 and T1, producing weakness of intrinsic hand muscles."}, {"num": 34, "q": "All the followings are characteristics of Horner syndrome except:", "options": ["Ptosis", "Meiosis", "Exophthalmos", "Anhidrosis"], "answer": 2, "explanation": "Horner syndrome causes ptosis, miosis, anhidrosis and apparent enophthalmos; exophthalmos is the opposite finding."}, {"num": 35, "q": "In fascial nerve injury which is correct:", "options": ["Inability to close the eye firmly on affected side", "Obliteration of nasolabial fold on affected side", "Deviation of the angle of mouth to healthy side", "All the above"], "answer": 3, "explanation": "Peripheral facial nerve palsy causes ipsilateral facial weakness, loss of the nasolabial fold and impaired eye closure, with the mouth pulled toward the healthy side."}, {"num": 36, "q": "Which is not true regarding sternomastoid muscle injury?", "options": ["May be due to traction of the neck or muscular hematoma", "Torticollis is common", "Physiotherapy is the first line treatment", "Surgical correction is the first line of the treatment"], "answer": 3, "explanation": "Physiotherapy is first-line; surgery is reserved for persistent cases, so surgical correction is not the initial treatment."}, {"num": 37, "q": "All the followings are types of intracranial hemorrhage except:", "options": ["Cerebral hemorrhage", "Germinal matrix hemorrhage", "Subgalial hemorrhage", "Subarachnoid hemorrhage"], "answer": 2, "explanation": "Subgaleal hemorrhage lies outside the skull beneath the galea aponeurotica, so it is not an intracranial hemorrhage."}, {"num": 38, "q": "All the following clinical signs are common associations for intracranial hemorrhage in the newborn except:", "options": ["Absent or depressed reflexes", "Depressed anterior fontanell", "Convulsions", "Anemia"], "answer": 1, "explanation": "Intracranial hemorrhage can produce a bulging/tense fontanelle from raised intracranial pressure; a depressed fontanelle is not typical."}, {"num": 39, "q": "Which of the following is characteristic for fracture clavicle?", "options": ["Absent Moro reflex on the affected side", "Pseudo paralysis of the affected side", "Crepitus and bone irregularity on the affected side", "All the above"], "answer": 3, "explanation": "Clavicular fracture may cause an absent Moro reflex on the affected side, pseudoparalysis and palpable crepitus/irregularity."}, {"num": 40, "q": "The following intracranial hemorrhages occur in premature baby EXCEPT:", "options": ["Subarachnoid hge", "Periventricular hge", "Subdural hge", "Intraventricular hge"], "answer": 2, "explanation": "Periventricular/germinal-matrix and intraventricular hemorrhage are especially associated with prematurity; subdural hemorrhage is more often traumatic and is the exception here."}, {"num": 41, "q": "Regarding to subgalial hematoma, which is false", "options": ["Soft and fluctuant swelling in the scalp", "Can accommodates for large amount of blood", "Is bleeding under the galea aponeurotica", "Aspiration is the main line of treatment"], "answer": 3, "explanation": "Subgaleal hemorrhage is a potentially major blood loss requiring supportive stabilization; aspiration is not the main treatment."}, {"num": 42, "q": "Which investigations is the last to be recommended in diagnosis of neonatal intra cranial hemorrhage?", "options": ["CBC", "Lumber puncture", "Cranial ultrasound", "CT of the brain"], "answer": 1, "explanation": "Lumbar puncture is avoided/left until last in suspected neonatal intracranial hemorrhage because imaging and safer laboratory tests should be used first."}]; let idx=0,score=0,answers=Array(QUESTIONS.length).fill(null);
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const q=QUESTIONS[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${QUESTIONS.length}`;document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('question').textContent=q.q;const img=document.getElementById('qimg');if(q.image){img.src=q.image;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')};const box=document.getElementById('options');box.innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');const exp=document.getElementById('explain');exp.style.display='none';exp.innerHTML='';document.getElementById('nextBtn').disabled=answers[idx]===null;document.getElementById('prevBtn').disabled=idx===0;box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));if(answers[idx]!==null)showAnswered()}
function choose(i){if(answers[idx]!==null)return;answers[idx]=i;if(i===QUESTIONS[idx].answer)score++;showAnswered();document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('nextBtn').disabled=false}
function showAnswered(){const q=QUESTIONS[idx],chosen=answers[idx];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===chosen&&i!==q.answer)b.classList.add('wrong')});const e=document.getElementById('explain');e.innerHTML=`<b>Explanation</b><br>${esc(q.explanation)}`;e.style.display='block'}
document.getElementById('nextBtn').onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render()}else finish()};document.getElementById('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};
function finish(){document.getElementById('quizView').style.display='none';document.getElementById('result').style.display='block';const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('finalScore').textContent=`${score} / ${QUESTIONS.length}`;document.getElementById('finalText').textContent=`${pct}%`;try{const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');all[QUIZ_ID]={0:{done:true,score,total:QUESTIONS.length,pct}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(all))}catch(e){}}
function restartQuiz(){idx=0;score=0;answers=Array(QUESTIONS.length).fill(null);document.getElementById('quizView').style.display='block';document.getElementById('result').style.display='none';render()}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('dbp_theme',t)}catch(e){};document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light':'🌙 Dark';document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F')}let saved='light';try{saved=localStorage.getItem('dbp_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}theme(saved);document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');render();
</script></body></html>
