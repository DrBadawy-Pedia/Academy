const QUIZ_ID="neonatology-vomiting-nec-quiz"; const PROGRESS_KEY='dbp_quizProgress'; const QUESTIONS=[{"num": 1, "q": "The commonest surgical emergency encountered in the preterm baby is:", "options": ["Meconium peritonitis", "Total aganglionosis", "Necrotizing enterocolitis", "Rectal atresia"], "answer": 2, "explanation": "The keyed answer is Necrotizing enterocolitis. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 2, "q": "A healthy doing well baby suffered from vomiting due to the following cause:", "options": ["Aerophagia", "Galactosemia", "Intussusception", "Meningitis", "Sepsis"], "answer": 0, "explanation": "In an otherwise well neonate, benign feeding-related causes are favored over systemic illness; here the keyed answer is Aerophagia."}, {"num": 3, "q": "Preterm baby 28 weeks gestational age was fed by Ryle in the first day of life about 30 ml every 2 hours. The baby developed necrotizing enter colitis with the following is a specific manifestation:", "options": ["Hypotension & shock", "Hypotonia & Hyporeflexia", "Hypothermia & sepsis", "Hypoventilation & cyanosis", "Tender abdominal wall"], "answer": 4, "explanation": "Abdominal wall tenderness is a local gastrointestinal sign and is more specific for NEC than nonspecific systemic findings such as shock or hypothermia."}, {"num": 4, "q": "A healthy doing well baby suffered from vomiting due to the following cause:", "options": ["Galactosemia", "Intussusception", "Meningitis", "Sepsis", "Swallowed maternal blood"], "answer": 4, "explanation": "In an otherwise well neonate, benign feeding-related causes are favored over systemic illness; here the keyed answer is Swallowed maternal blood."}, {"num": 5, "q": "Preterm baby 28 weeks gestational age was fed by Ryle in the first day of life about 30 ml every 2 hours. The baby developed necrotizing entero colitis with the following is not a risk factor of this condition:", "options": ["Catheterization of umbilical vessels", "Early breast feeding", "Patent ductus arteriousus with heart failure", "Peri-natal asphyxia", "Polycythemia"], "answer": 1, "explanation": "Breast milk is protective against NEC; early breast feeding is therefore not a risk factor."}, {"num": 6, "q": "A preterm baby in NICU on artificial feeding developed feeding intolerance, bilious vomiting, abdominal distension, X ray abdomen showed intestinal pneumatosis. Which one of the following is most possible diagnosis?", "options": ["Meconium ileus", "Ileal atresia", "Midgut volvulus", "Necrotizing enterocolitis"], "answer": 3, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 7, "q": "The MOST important risk factor for necrotizing enterocolitis in preterm infants is:", "options": ["Delivery by cesarean section", "Breast feeding", "Apgar score", "Gestational age and birth weight"], "answer": 3, "explanation": "Lower gestational age and lower birth weight are the strongest background risk factors because intestinal immaturity is central to NEC susceptibility."}, {"num": 8, "q": "Male preterm 30 weeks after 12 days of delivery has developed persistent vomiting, abdominal distention & bloody stoolThe most probable diagnosis of such case is", "options": ["Neonatal sepsis", "Duodenal atresia", "Necrotising enterocolitis", "Diaphragmatic hernia"], "answer": 2, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 9, "q": "Male preterm 30 weeks after 12 days of delivery has developedpersistent vomiting, abdominal distention & bloody stool Which of the following is avoided in treatment of this case:", "options": ["Strong antibiotics", "Highly concentrated formula", "Total parental nutrition", "Inotopic drugs"], "answer": 1, "explanation": "Enteral feeding is stopped in suspected NEC; a highly concentrated formula would worsen intestinal stress and is avoided."}, {"num": 10, "q": "Male preterm 30 weeks after 12 days of delivery has developedpersistent vomiting, abdominal distention & bloody stool:The laboratory triad that helps in diagnosis is", "options": ["Hyponatremia, respiratory acidosis and thrombocytopenia", "Hypernatremia, metabolic acidosis, and thrombocytopenia", "Hyponatremia, metabolic acidosis, and thrombocytopenia", "Hypernatremia, respiratory acidosis and thrombocytosis"], "answer": 2, "explanation": "NEC commonly produces systemic illness with metabolic acidosis, thrombocytopenia and hyponatremia, a classic laboratory pattern in severe disease."}, {"num": 11, "q": "A 2 week old neonate who was born at 32 weeks gestation has recovered from respiratory distress syndrome. He has been tolerating increasing volumes of enteral feedings via gavage. Over the past several feedings, bilous vomiting, abdominal distension, gastric brown aspirate, and stools that are positive for blood have been noted. The most likely explanation of this condition is:", "options": ["Necrotizing enterocolitis", "Congenital pyloric stenosis", "Hischsprung disease", "Gastro esophageal reflux"], "answer": 0, "explanation": "The keyed answer is Necrotizing enterocolitis. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 12, "q": "What’s your diagnosis", "options": ["Gastroesophageal reflux (GERD)", "Necrotizing enterocolitis", "Congenital hypertrophic pyloric stenosis", "Neonatal sepsis"], "answer": 0, "explanation": "The keyed answer is Gastroesophageal reflux (GERD). It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 13, "q": "The most important risk factor for necrotizing enterocolitis is:", "options": ["Perinatal asphyxia", "Prematurity", "Catheterization of the umbilicus", "Polycythemia"], "answer": 1, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 14, "q": "Swallowed blood in the newborn can be diagnosed by:", "options": ["Barium meal", "Gastric lavage with saline", "Platelet count", "Apt test"], "answer": 3, "explanation": "The Apt test distinguishes fetal hemoglobin from swallowed maternal blood, helping identify maternal blood as the source."}, {"num": 15, "q": "Metabolic cause of neonatal vomiting", "options": ["Galactosemia", "Hypoalbuminemia", "Hypoglycemia", "Hypocalcemia"], "answer": 0, "explanation": "Galactosemia is an inborn error of metabolism that can present in the neonate with vomiting, poor feeding and systemic illness after milk feeds begin."}, {"num": 16, "q": "A Preterm female newborn admitted with poor feeding and hyperthermia, she was born by elective CS because of prolonged PROM and Oligohydrominos. She was 35 week gestation and umbilical catheter was inserted to give medication, as there was failure of peripheral vascular line. She started feeding orally 7 days ago and gradually developed abdominal distension. 3 days ago, she developed bile stained vomiting, bloody stool and the general condition worsen. What is your explanation?", "options": ["GERD", "NEC", "CHPS", "None of the above"], "answer": 1, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 17, "q": "The nurse from the level II neonatal intensive care nursery calls you to evaluate a baby. The infant born at 32 week gestation is now 1 week old and had been doing well on increasing nasogastric feedings. This afternoon, however, the nurse noted that the infant has vomited the last two feedings and seems less active. Your examination reveals a tense and distended abdomen with decreased bowel sounds. As you are evaluating the infant, he has a grossly bloody stool", "options": ["GERD", "NEC", "CHPS", "None of the above"], "answer": 1, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 18, "q": "The commonest cause of a bloody stool in the preterm is", "options": ["Formula intolerance", "NEC", "Coagulation disorder", "Swallowed maternal blood"], "answer": 1, "explanation": "Prematurity plus feeding intolerance, bilious vomiting, abdominal distension, bloody stool and/or pneumatosis intestinalis strongly points to necrotizing enterocolitis."}, {"num": 19, "q": "Most common cause of vomiting in doing well baby (‫ )ﻣﺪارﺳﺎت‬", "options": ["CHPS", "Galactosemia", "GERD", "Aerophagia", "Over feeding"], "answer": 2, "explanation": "The keyed answer is GERD. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}]; let idx=0,score=0,answers=Array(QUESTIONS.length).fill(null);
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const q=QUESTIONS[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${QUESTIONS.length}`;document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('question').textContent=q.q;const img=document.getElementById('qimg');if(q.image){img.src=q.image;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')};const box=document.getElementById('options');box.innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');const exp=document.getElementById('explain');exp.style.display='none';exp.innerHTML='';document.getElementById('nextBtn').disabled=answers[idx]===null;document.getElementById('prevBtn').disabled=idx===0;box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));if(answers[idx]!==null)showAnswered()}
function choose(i){if(answers[idx]!==null)return;answers[idx]=i;if(i===QUESTIONS[idx].answer)score++;showAnswered();document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('nextBtn').disabled=false}
function showAnswered(){const q=QUESTIONS[idx],chosen=answers[idx];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===chosen&&i!==q.answer)b.classList.add('wrong')});const e=document.getElementById('explain');e.innerHTML=`<b>Explanation</b><br>${esc(q.explanation)}`;e.style.display='block'}
document.getElementById('nextBtn').onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render()}else finish()};document.getElementById('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};
function finish(){document.getElementById('quizView').style.display='none';document.getElementById('result').style.display='block';const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('finalScore').textContent=`${score} / ${QUESTIONS.length}`;document.getElementById('finalText').textContent=`${pct}%`;try{const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');all[QUIZ_ID]={0:{done:true,score,total:QUESTIONS.length,pct}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(all))}catch(e){}}
function restartQuiz(){idx=0;score=0;answers=Array(QUESTIONS.length).fill(null);document.getElementById('quizView').style.display='block';document.getElementById('result').style.display='none';render()}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('dbp_theme',t)}catch(e){};document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light':'🌙 Dark';document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F')}let saved='light';try{saved=localStorage.getItem('dbp_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}theme(saved);document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');render();
</script></body></html>
