</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="neonatology-quiz.html"><div class="logo">MB</div><div><b>Dr Badawy Academy</b><small>PEDIATRICS · NEONATOLOGY</small></div></a><button class="top-btn" id="themeBtn">🌙 Dark</button></header><main><section class="hero"><div class="kicker">NEONATOLOGY · FINAL MCQs</div><h1>Prematurity</h1><p>16 exam-style questions with instant correction and concise explanations.</p></section><section class="quiz-card"><div id="quizView"><div class="meta"><span id="progress"></span><span id="scoreLive">Score 0</span></div><div class="question" id="question"></div><img id="qimg" class="qimg" hidden><div class="options" id="options"></div><div class="explain" id="explain"></div><div class="actions"><button class="btn secondary" id="prevBtn">← Previous</button><button class="btn" id="nextBtn" disabled>Next →</button></div></div><div class="result" id="result"><div>Quiz complete</div><div class="score" id="finalScore"></div><p id="finalText"></p><button class="btn" onclick="restartQuiz()">Try Again</button></div></section></main><footer class="footer">DR BADAWY ACADEMY · PEDIATRICS · Interactive Learning</footer></div><script>
const QUIZ_ID="neonatology-prematurity-quiz"; const PROGRESS_KEY='dbp_quizProgress'; const QUESTIONS=[{"num": 2, "q": "A mother delivered a preterm baby who defined as baby delivered before....... week's gestational age.", "options": ["34", "35", "36", "37"], "answer": 3, "explanation": "Prematurity is birth before 37 completed weeks of gestation."}, {"num": 3, "q": "A pregnant woman delivered a 34 weeks gestational age baby with the following character:", "options": ["Eye opened", "Long hair", "Short nail", "Wrinkled, dry skin"], "answer": 2, "explanation": "The keyed answer is Short nail. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 4, "q": "Pregnant female delivered preterm baby. The preterm bay was admitted to neonatal intensive care unit. The following can be used to detect retinopathy of prematurity", "options": ["Corneal reflex.", "Field of vision.", "Light reflex.", "Visual acuity.", "Fundus screening"], "answer": 4, "explanation": "Retinopathy of prematurity is detected by retinal/fundus screening rather than bedside visual-function tests."}, {"num": 5, "q": "Mother was delivered a 30 weeks neonate with respiratory distress syndrome and admitted for 45 days. The following instructions must be done by the parents:", "options": ["Avoid doctor visits.", "Baby's party.", "Contact with animal.", "Don't give vaccine.", "Isolation."], "answer": 4, "explanation": "The keyed answer is Isolation.. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 6, "q": "A pregnant woman delivered a full term baby with the following character.", "options": ["Creases of sole were smooth.", "Hard ear lobule.", "Small breast nodule.", "Small libia majora.", "Smooth scrotum"], "answer": 1, "explanation": "The keyed answer is Hard ear lobule.. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 7, "q": "The premature is not expected to have the following complication:", "options": ["Infections.", "Hyperbilirubinemia.", "Polycythemia.", "Malnutrition."], "answer": 2, "explanation": "Polycythemia is not a typical complication of prematurity; anemia, infection, jaundice and nutritional problems are more characteristic."}, {"num": 8, "q": "The MOST important independent predictor of survival of extreme prematurity is which one of the following:", "options": ["Birth weight", "Administration of antenatal steroids", "Administration of magnesium sulphate", "Gestation at birth"], "answer": 3, "explanation": "Gestational age at birth is the strongest independent predictor of survival at the extremes of prematurity because organ maturity rises sharply with gestation."}, {"num": 9, "q": "The following are recognized complienations in a post term baby EXCEPT:", "options": ["Birth asphyxia.", "Hypoglycema.", "Hyaline membrane disease.", "Hypocalcemia"], "answer": 2, "explanation": "Hyaline membrane disease is primarily a disease of prematurity due to surfactant deficiency, not a typical post-term complication."}, {"num": 10, "q": "Preterm baby is liable to many problems because of:", "options": ["Low birth weight", "His or her feeble cry", "Immaturity of systems", "Hypotonia of muscles"], "answer": 2, "explanation": "The broad vulnerability of the preterm infant is fundamentally due to immaturity of multiple organ systems."}, {"num": 11, "q": "All of the following are characteristics of the preterm infants EXCEPT", "options": ["Extremities thin.", "Breast engorgement.", "Minimal subcutaneous fat.", "Hypotonic muscles"], "answer": 1, "explanation": "Premature infants have reduced breast tissue development; breast engorgement is not a characteristic feature of prematurity."}, {"num": 12, "q": "The length of a full-term normal baby is commonly", "options": ["40 cm", "45 cm", "50 cm", "$ ‫ﻛ *ٮٮ(ﺮ‬", "55 cm ‫أوڡﺮ ده‬"], "answer": 2, "explanation": "The average length of a normal full-term newborn is about 50 cm."}, {"num": 13, "q": "Low stores of vitamin K in newborn may result in:", "options": ["Hypothyroidism", "Erythrocyte destruction", "Hemorrhage", "Thrombocytopenia"], "answer": 2, "explanation": "Newborn vitamin K stores are low; prophylactic vitamin K (Konakion) prevents vitamin-K-deficiency bleeding."}, {"num": 14, "q": "The fine hair covering the skin of a newborn is called:", "options": ["Vernix caseosa.", "Mottling.", "Lanugo.", "Milia."], "answer": 2, "explanation": "Lanugo is the fine, soft hair covering the fetus/newborn, especially prominent in preterm infants."}, {"num": 15, "q": "All the followings are characteristic of the preterm except:", "options": ["Thin extremities", "Minimal subcutaneous fat", "Shot nails.", "Hypertonia of the muscles"], "answer": 3, "explanation": "The keyed answer is Hypertonia of the muscles. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 16, "q": "The commonest intracranial hemorrhage in a preterm baby is:", "options": ["Extradural hge", "Periventricular/Intraventricular hge", "Subdural hge", "Intracerebral hge"], "answer": 1, "explanation": "Germinal-matrix/periventricular-intraventricular hemorrhage is the characteristic intracranial hemorrhage of prematurity."}, {"num": 17, "q": "Stage III of retinopathy of prematurity showed", "options": ["V.C. of retinal blood vessels", "V.D. of retinal blood vessels ± vitreous hge.", "Neovascularization of the retina", "Retinal detachment."], "answer": 2, "explanation": "Stage III retinopathy of prematurity is defined by extraretinal fibrovascular proliferation/neovascularization."}]; let idx=0,score=0,answers=Array(QUESTIONS.length).fill(null);
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const q=QUESTIONS[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${QUESTIONS.length}`;document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('question').textContent=q.q;const img=document.getElementById('qimg');if(q.image){img.src=q.image;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')};const box=document.getElementById('options');box.innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');const exp=document.getElementById('explain');exp.style.display='none';exp.innerHTML='';document.getElementById('nextBtn').disabled=answers[idx]===null;document.getElementById('prevBtn').disabled=idx===0;box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));if(answers[idx]!==null)showAnswered()}
function choose(i){if(answers[idx]!==null)return;answers[idx]=i;if(i===QUESTIONS[idx].answer)score++;showAnswered();document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('nextBtn').disabled=false}
function showAnswered(){const q=QUESTIONS[idx],chosen=answers[idx];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===chosen&&i!==q.answer)b.classList.add('wrong')});const e=document.getElementById('explain');e.innerHTML=`<b>Explanation</b><br>${esc(q.explanation)}`;e.style.display='block'}
document.getElementById('nextBtn').onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render()}else finish()};document.getElementById('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};
function finish(){document.getElementById('quizView').style.display='none';document.getElementById('result').style.display='block';const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('finalScore').textContent=`${score} / ${QUESTIONS.length}`;document.getElementById('finalText').textContent=`${pct}%`;try{const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');all[QUIZ_ID]={0:{done:true,score,total:QUESTIONS.length,pct}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(all))}catch(e){}}
function restartQuiz(){idx=0;score=0;answers=Array(QUESTIONS.length).fill(null);document.getElementById('quizView').style.display='block';document.getElementById('result').style.display='none';render()}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('dbp_theme',t)}catch(e){};document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light':'🌙 Dark';document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F')}let saved='light';try{saved=localStorage.getItem('dbp_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}theme(saved);document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');render();
</script></body></html>
