</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="neonatology-quiz.html"><div class="logo">MB</div><div><b>Dr Badawy Academy</b><small>PEDIATRICS · NEONATOLOGY</small></div></a><button class="top-btn" id="themeBtn">🌙 Dark</button></header><main><section class="hero"><div class="kicker">NEONATOLOGY · FINAL MCQs</div><h1>TORCH &amp; Neonatal Septicemia</h1><p>27 exam-style questions with instant correction and concise explanations.</p></section><section class="quiz-card"><div id="quizView"><div class="meta"><span id="progress"></span><span id="scoreLive">Score 0</span></div><div class="question" id="question"></div><img id="qimg" class="qimg" hidden><div class="options" id="options"></div><div class="explain" id="explain"></div><div class="actions"><button class="btn secondary" id="prevBtn">← Previous</button><button class="btn" id="nextBtn" disabled>Next →</button></div></div><div class="result" id="result"><div>Quiz complete</div><div class="score" id="finalScore"></div><p id="finalText"></p><button class="btn" onclick="restartQuiz()">Try Again</button></div></section></main><footer class="footer">DR BADAWY ACADEMY · PEDIATRICS · Interactive Learning</footer></div><script>
const QUIZ_ID="neonatology-torch-septicemia-quiz"; const PROGRESS_KEY='dbp_quizProgress'; const QUESTIONS=[{"num": 1, "q": "A woman suffered from repeated abortion due to toxoplasmosis. They catch infection by:", "options": ["A-Cat's stool.", "B-Blood transfusion.", "C-Droplet.", "D-Parental.", "E-Sexual contact"], "answer": 0, "explanation": "Toxoplasma gondii is acquired from oocysts shed in cat feces (and also from undercooked meat); cat stool is the relevant route among the choices."}, {"num": 2, "q": "A preterm baby was admitted to the incubator after 6 days and developed sepsis with the following non-specific manifestation:", "options": ["A- Hypotension.", "B- Jaundice.", "C- Meningitis.", "D- Pneumonia.", "E- Septic arthritis"], "answer": 0, "explanation": "The stem is testing the typical neonatal sepsis pattern; A- Hypotension. best fits the timing, risk factor or clinical feature described."}, {"num": 3, "q": "A woman suffered from repeated abortion due to cytomegalovirus infection. The virus can be isolated accurately from the baby's:", "options": ["A- Cerebrospinal fluid (CSF).", "B- Skin.", "C- Sputum.", "D- Stool.", "E- Urine."], "answer": 4, "explanation": "Congenital CMV is classically detected by isolating/detecting virus in neonatal urine or saliva early in life."}, {"num": 4, "q": "A preterm baby was admitted to the incubator after 2 days developed sepsis. The following organism was included as a cause of this condition:", "options": ["A- Candida infection.", "B- Fungal dissemination.", "C- Group B Streptococci.", "D- Pseudomonas organism.", "E- Viral infection"], "answer": 2, "explanation": "Group B Streptococcus is a classic cause of early-onset neonatal infection acquired around delivery."}, {"num": 5, "q": "A woman suffered from repeated abortion due to congenital cytomegalovirus infection. They catch infection by:", "options": ["A- Cat's stool.", "B- Droplet.", "C- Genital lesion.", "D- Raw meat.", "E-Sexual contact"], "answer": 4, "explanation": "CMV may be transmitted through sexual contact and other body fluids; among the listed routes, sexual contact is the keyed route."}, {"num": 6, "q": "A 34-week-old gestational-age preterm baby was admitted to the incubator at the age of one day due to neonatal sepsis with his mother suffering from a bad odor of amniotic fluid. The following is the causative organism:", "options": ["A- Candida.", "B- Group B Streptococci.", "C- Klebsiella.", "D- Pseudomonas", "E- Staph. aureus."], "answer": 1, "explanation": "Group B Streptococcus is a classic cause of early-onset neonatal infection acquired around delivery."}, {"num": 7, "q": "A preterm baby developed sepsis after 10 days. The following is the best investigation to diagnose this condition:", "options": ["A-Blood culture.", "B- C reactive protein.", "C- Erythrocyte sedimentation rate.", "D- Liver function.", "E- Procalcitonin"], "answer": 0, "explanation": "Blood culture is the definitive microbiologic test for neonatal sepsis, while CRP and procalcitonin are supportive markers."}, {"num": 8, "q": "The most common organism causing congenital pneumonia is:", "options": ["Staph aureus", "E coli", "Group A streptococci", "Group B streptococci"], "answer": 3, "explanation": "The keyed answer is Group B streptococci. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 9, "q": "Late neonatal pneumonia is commonly caused by:", "options": ["A. Pseudomonas", "B. Listeria monocytogenes", "C. Proteus", "D. Staphylococcus aureus"], "answer": 3, "explanation": "The keyed answer is D. Staphylococcus aureus. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 10, "q": "Congenital rubella syndrome is a disease due to:", "options": ["A. Birth trauma", "B. Postnatal bacterial infection", "C. Chromosomal aberration", "D. Viral transplacental infection"], "answer": 3, "explanation": "Congenital rubella results from maternal rubella viremia crossing the placenta and infecting the fetus."}, {"num": 11, "q": "In premature rupture of membranes, the commonest complication is:", "options": ["A. Precipitate labor.", "B. Perinatal asphyxia", "C. Antenatal hemorrhage.", "D. Neonatal sepsis"], "answer": 3, "explanation": "The keyed answer is D. Neonatal sepsis. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 12, "q": "The common organism detected in late onset neonatal sepsis is:", "options": ["A. Streptococci", "B. Staphylococci", "C. Klebsiella", "D. H. influenza"], "answer": 1, "explanation": "Late-onset neonatal infection is commonly associated with hospital/environmental organisms, including staphylococci."}, {"num": 13, "q": "A high serum IgM in an infant at birth indicates:", "options": ["A. Prematurity.", "B. Intracranial hemorrhage.", "C. Intrauterine infection.", "D. Immune deficiency diseases"], "answer": 2, "explanation": "Maternal IgM does not cross the placenta, so elevated neonatal IgM indicates that the infant produced it in response to intrauterine infection."}, {"num": 14, "q": "In rubella syndrome, all features are correct EXCEPT:", "options": ["A. Cataract & glaucoma", "B. Mental retardation", "C. Macrocephaly", "D. Congenital heart disease"], "answer": 2, "explanation": "Congenital rubella is associated with growth restriction and microcephaly rather than macrocephaly; cataract and congenital heart disease are classic findings."}, {"num": 15, "q": "Findings from WBCs, suggestive of neonatal sepsis include the following EXCEPT:", "options": ["A. Total WBCs < 5000/mm", "B. Lymphocytosis", "C. Bandemia", "D. Neutropenia"], "answer": 1, "explanation": "The stem is testing the typical neonatal sepsis pattern; B. Lymphocytosis best fits the timing, risk factor or clinical feature described."}, {"num": 16, "q": "Intrauterine infection may result in all except:", "options": ["A. Short stature.", "B. Intraventricular hemorrhage.", "C. Cataract.", "D. Patent ductus arteriosus.", "E. Mental handicap"], "answer": 1, "explanation": "Cataract, PDA, growth impairment and neurodevelopmental injury are recognized congenital-infection consequences; IVH is not a typical direct congenital-infection feature in this list."}, {"num": 17, "q": "The following features suggest a diagnosis of toxoplasma as a cause of congenital infection:", "options": ["A. Growth retardation", "B. Petechiae", "C. Focal chorioretinitis", "D. Hydrocephalus", "E. All of the above"], "answer": 4, "explanation": "Congenital toxoplasmosis can produce growth restriction, petechiae, chorioretinitis and hydrocephalus, so all listed findings may occur."}, {"num": 18, "q": "The following are recognized risk factors for neonatal group B streptococcus (GBS) infection:", "options": ["A. Preterm labor.", "B. Prolonged rupture of membranes greater than 24 hours.", "C. Chorioamnionitis.", "D. Maternal GBS urinary tract infection.", "E. All of the abov"], "answer": 4, "explanation": "The stem is testing the typical neonatal sepsis pattern; E. All of the abov best fits the timing, risk factor or clinical feature described."}, {"num": 19, "q": "Early onset septicemia occurs in:", "options": ["A. The 1st 24 hours", "B. The 1st week of life", "C. The 1st month", "D. All of the above"], "answer": 1, "explanation": "The stem is testing the typical neonatal sepsis pattern; B. The 1st week of life best fits the timing, risk factor or clinical feature described."}, {"num": 20, "q": "Risk factors for neonatal sepsis are:", "options": ["A. Maternal suprapubic tenderness", "B. Prematurity and low birthweight", "C. Premature rupture of membranes", "D. All of the above"], "answer": 3, "explanation": "Each listed item is a recognized risk factor or manifestation in the context of neonatal sepsis, so the combined option is correct."}, {"num": 21, "q": "The common organism detected in early onset septicemia is:", "options": ["A. Staphylococci", "B. H. influenza", "C. Group B Streptococci", "D. Klebsiella"], "answer": 2, "explanation": "Group B Streptococcus is a classic cause of early-onset neonatal infection acquired around delivery."}, {"num": 22, "q": "All of the following types of TORCH infections are sexually transmitted to the mother baby except", "options": ["A. CMV", "B. Herpes simplex", "C. Syphilis", "D. Toxoplasmosis"], "answer": 3, "explanation": "The keyed answer is D. Toxoplasmosis. It best matches the defining feature, expected association or management principle tested by the stem; the other options do not fit that neonatal pattern as closely."}, {"num": 23, "q": "Perinatal herpes simplex infection can present with in the newborn", "options": ["A. Skin, eye, and mouth lesions", "B. CNS infection", "C. Sepsis-like (disseminated disease)", "D. All of the above"], "answer": 3, "explanation": "Neonatal HSV can present as skin-eye-mouth disease, CNS disease or disseminated sepsis-like disease; all three patterns are recognized."}, {"num": 24, "q": "Regarding congenital neonatal toxoplasma infection, which is false?", "options": ["A. Hydrocephalus is a common association", "B. Transmitted by inhalation of oocytes from the faces of the cat", "C. Increased specific IgM to Toxoplasma gondii is diagnostic", "D. Treatment is by Acyclovir"], "answer": 3, "explanation": "Acyclovir treats herpes viruses, not toxoplasmosis; congenital toxoplasmosis requires specific anti-Toxoplasma therapy."}, {"num": 25, "q": "All of the following are risk factors for early sepsis except:", "options": ["A. Maternal intrapartum fever,", "B. Uterine tenderness,", "C. Chorioamnionitis", "D. PROM 6 hours before delivery"], "answer": 3, "explanation": "The stem is testing the typical neonatal sepsis pattern; D. PROM 6 hours before delivery best fits the timing, risk factor or clinical feature described."}, {"num": 26, "q": "Neonatal sepsis is suggested in the presence of the following except:", "options": ["A. WBC's count <5000 or 30000/cc.", "B. Neutropenia <1000/cc.", "C. Band count <10%", "D. Positive CRP and procalcitonin"], "answer": 2, "explanation": "Sepsis is associated with bandemia/increased immature neutrophils; a band count below 10% does not support that pattern."}, {"num": 27, "q": "The following features suggest a diagnosis of toxoplasma as a cause of congenital infection", "options": ["A. Growth retardation", "B. Petechiae", "C. Focal chorioretinitis", "D. Hydrocephalus", "E. All of the above"], "answer": 4, "explanation": "Congenital toxoplasmosis can produce growth restriction, petechiae, chorioretinitis and hydrocephalus, so all listed findings may occur."}]; let idx=0,score=0,answers=Array(QUESTIONS.length).fill(null);
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const q=QUESTIONS[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${QUESTIONS.length}`;document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('question').textContent=q.q;const img=document.getElementById('qimg');if(q.image){img.src=q.image;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')};const box=document.getElementById('options');box.innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');const exp=document.getElementById('explain');exp.style.display='none';exp.innerHTML='';document.getElementById('nextBtn').disabled=answers[idx]===null;document.getElementById('prevBtn').disabled=idx===0;box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));if(answers[idx]!==null)showAnswered()}
function choose(i){if(answers[idx]!==null)return;answers[idx]=i;if(i===QUESTIONS[idx].answer)score++;showAnswered();document.getElementById('scoreLive').textContent=`Score ${score}`;document.getElementById('nextBtn').disabled=false}
function showAnswered(){const q=QUESTIONS[idx],chosen=answers[idx];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===chosen&&i!==q.answer)b.classList.add('wrong')});const e=document.getElementById('explain');e.innerHTML=`<b>Explanation</b><br>${esc(q.explanation)}`;e.style.display='block'}
document.getElementById('nextBtn').onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render()}else finish()};document.getElementById('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};
function finish(){document.getElementById('quizView').style.display='none';document.getElementById('result').style.display='block';const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('finalScore').textContent=`${score} / ${QUESTIONS.length}`;document.getElementById('finalText').textContent=`${pct}%`;try{const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');all[QUIZ_ID]={0:{done:true,score,total:QUESTIONS.length,pct}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(all))}catch(e){}}
function restartQuiz(){idx=0;score=0;answers=Array(QUESTIONS.length).fill(null);document.getElementById('quizView').style.display='block';document.getElementById('result').style.display='none';render()}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('dbp_theme',t)}catch(e){};document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light':'🌙 Dark';document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F')}let saved='light';try{saved=localStorage.getItem('dbp_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}theme(saved);document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');render();
</script></body></html>
