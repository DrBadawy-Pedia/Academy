<style>

.brand{display:flex;align-items:center;gap:11px}.mini-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:#10283E;font-family:Georgia,serif;font-size:16px;font-weight:800;letter-spacing:-2px;box-shadow:0 7px 18px rgba(0,0,0,.14)}
.brand-text{font-family:var(--serif);font-weight:600;line-height:1.1;font-size:15px}.brand-text small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.11em;color:var(--muted);font-weight:800;margin-top:4px}

/* Hero — identical component to the homepage hero */
.hero{position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(118deg,#1D294C 0%,#24375E 56%,#127E80 150%);padding:44px 48px 42px;color:#fff;box-shadow:var(--shadow2)}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.09);border-radius:50%;pointer-events:none}

.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:start}
.hero-kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold2);text-transform:uppercase;margin-bottom:14px}

@media(max-width:800px){.hero{padding:28px 22px;border-radius:23px}.hero-grid{grid-template-columns:1fr}.hero-mark{position:absolute;right:18px;top:22px;width:68px;height:68px;border-radius:19px;font-size:25px}.hero h1{font-size:42px;padding-right:55px}.hero p{font-size:13.5px}}

.choice.correct{border-color:var(--green);background:var(--greenbg)}
.choice.correct .badge{background:var(--green);color:#fff;border-color:var(--green)}
.choice.wrong{border-color:var(--red);background:var(--redbg)}
.choice.wrong .badge{background:var(--red);color:#fff;border-color:var(--red)}

.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.7;display:none}

[data-theme=dark] .restart{color:#091624}
.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}

.result{text-align:center;padding:4px}
.result .eyebrow{display:block;margin-bottom:6px}
.score-big{font-family:var(--serif);font-size:50px;color:var(--ink);font-weight:700;margin:4px 0}
.result h2{margin:0 0 8px;color:var(--teal);font-size:22px;font-family:var(--serif)}
.result p{font-size:13.5px;line-height:1.7;color:var(--muted)}
.review{margin-top:18px;text-align:left;background:var(--surface2);padding:16px;border-radius:14px;border:1px solid var(--line)}
.review div{padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:13px}
.review div:last-child{border-bottom:0}
.review small{display:inline-block;color:var(--muted)}
.tag{display:inline-block;background:var(--goldbg);color:var(--gold);padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:800;margin:0 4px}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

.footer{text-align:center;padding-top:30px;color:var(--faint);font-size:10.5px}
.footer b{font-family:var(--serif);font-size:13px;color:var(--soft);display:block;margin-bottom:3px}

@media(max-width:600px){
  .shell{padding:0 15px 70px}
  .card{padding:20px}

  .actions{align-items:stretch;flex-direction:column}
  .btn{width:100%}

}

<script>
function theme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('dbp_theme',t);}catch(e){}
  const btn=document.getElementById('themeBtn');
  btn.textContent=t==='dark'?'☀️ Light':'🌙 Dark';
  document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#10141B':'#16324F');
}
let savedTheme='light';
try{savedTheme=localStorage.getItem('dbp_theme')||(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
theme(savedTheme);
document.getElementById('themeBtn').onclick=()=>theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ---- Progress persistence (shared with index.html via localStorage) ---- */
const QUIZ_ID='clinical-general-appearance';
const PROGRESS_KEY='dbp_quizProgress';
function getQuizProgress(){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    return all[QUIZ_ID]||{};
  }catch(e){return {};}
}
function saveQuizProgress(sectionIdx,score,total){
  try{
    const all=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
    if(!all[QUIZ_ID])all[QUIZ_ID]={};
    const pct=Math.round(score/total*100);
    const prev=all[QUIZ_ID][sectionIdx];
    all[QUIZ_ID][sectionIdx]={done:true,score,total,pct:(prev&&prev.pct>pct)?prev.pct:pct};
    localStorage.setItem(PROGRESS_KEY,JSON.stringify(all));
  }catch(e){}
}

const SECTIONS = [{"en":"General Appearance · Complete Quiz","icon":"GA","q":[{"en":"A comatose child requires urgent critical care assessment when the Glasgow Coma Scale is:","opts":["10","12","9","6"],"ans":3,"exp":"A GCS of 8 or lower indicates severe impairment of consciousness; 6 is the only score in this range."},{"en":"Which is NOT one of the facial patterns listed with Down syndrome, thalassemia or familial traits?","opts":["Down syndrome","Thalassemia","Familial or racial traits","Congenital hypothyroidism"],"ans":3,"exp":"Congenital hypothyroidism is associated with coarse facial features, a different pattern."},{"en":"A wizened face is characteristic of:","opts":["Severe (third-degree) marasmus","Second-degree marasmus","First-degree marasmus","Simple underweight"],"ans":0,"exp":"Marked wasting in severe marasmus can produce a wizened facial appearance as the buccal fat pad is lost."},{"en":"The buccal fat pad is relatively preserved until late in severe wasting mainly because:","opts":["It has a distinctive composition","It is needed for suckling","It maintains facial appearance","All of the above"],"ans":0,"exp":"The buccal fat pad has a distinctive composition and is relatively preserved in malnutrition. A cosmetic role is not an adequate physiologic explanation."},{"en":"Orthopneic position is associated with:","opts":["Pericardial effusion","Pleural effusion","Heart failure","Meningitis"],"ans":2,"exp":"Pulmonary congestion in heart failure can worsen breathing while lying flat, so the child prefers to sit upright."},{"en":"Opisthotonos is associated with:","opts":["Pericardial effusion","Pleural effusion","Heart failure","Meningitis"],"ans":3,"exp":"Opisthotonos is marked neck hyperextension and arching of the back; meningitis is the association given in the lesson."},{"en":"Squatting position is characteristic of the following EXCEPT:","opts":["Tetralogy of Fallot","Tricuspid atresia","Transposition of the great arteries","Pulmonary atresia"],"ans":2,"exp":"Squatting is classically linked to tetralogy of Fallot and cyanotic lesions with reduced pulmonary flow. Uncomplicated transposition of the great arteries is the exception among these options."},{"en":"Tripod position may occur in:","opts":["Acute epiglottitis","Bronchial asthma","Both","Neither"],"ans":2,"exp":"A child with respiratory distress may lean forward to recruit accessory muscles; the posture may be seen in both conditions."},{"en":"Prayer position is associated with:","opts":["Pericardial effusion","Pleural effusion","Heart failure","Meningitis"],"ans":0,"exp":"Prayer position is listed among the abnormal positions with pericardial effusion."},{"en":"Which statement about decorticate posture is FALSE?","opts":["It may signal severe brain injury","The lower limbs are extended","The upper limbs are flexed","The upper limbs are extended"],"ans":3,"exp":"Decorticate posturing has flexed upper limbs and extended lower limbs; upper-limb extension describes a different posture."},{"en":"Acetone odor of the breath is associated with:","opts":["Chronic renal failure","Diabetic ketoacidosis","Liver failure","Phenylketonuria"],"ans":1,"exp":"Ketone production in diabetic ketoacidosis can give the breath an acetone odor."},{"en":"A rotten-apple or fetor hepaticus breath odor is associated with:","opts":["Chronic renal failure","Diabetic ketoacidosis","Liver failure","Phenylketonuria"],"ans":2,"exp":"Fetor hepaticus is a distinctive breath odor associated with severe liver disease."},{"en":"A croupy cough is characteristic of:","opts":["Acute tracheitis","Acute laryngitis","Bronchial asthma","Pertussis"],"ans":1,"exp":"Inflammation around the larynx can produce a barking or croupy cough."},{"en":"A brassy cough is characteristic of:","opts":["Acute tracheitis","Acute laryngitis","Bronchial asthma","Pertussis"],"ans":0,"exp":"A harsh brassy quality suggests tracheal involvement among these choices."},{"en":"A wheezy or tight cough is characteristic of:","opts":["Acute tracheitis","Acute laryngitis","Bronchial asthma","Pertussis"],"ans":2,"exp":"Lower-airway narrowing in asthma may give the cough a tight or wheezy character."},{"en":"A spasmodic cough is characteristic of:","opts":["Acute tracheitis","Acute laryngitis","Bronchial asthma","Pertussis"],"ans":3,"exp":"Pertussis causes repeated paroxysms or spasms of coughing."},{"en":"Which description best matches snoring?","opts":["Inspiratory, low-pitched sound from oropharyngeal obstruction","Harsh inspiratory sound from laryngeal obstruction","Intermittent inspiratory and expiratory sound from secretions","Musical expiratory sound from lower-airway obstruction"],"ans":0,"exp":"Snoring is typically a low-pitched, irregular inspiratory noise associated with oropharyngeal obstruction."},{"en":"Which description best matches stridor?","opts":["Low-pitched inspiratory sound from the oropharynx","Harsh inspiratory sound from partial laryngeal or tracheal obstruction","Intermittent sound from airway secretions","Musical expiratory sound from the lower airway"],"ans":1,"exp":"Stridor is predominantly inspiratory and points to obstruction at the larynx or trachea."},{"en":"Which description best matches rattling?","opts":["Low-pitched inspiratory snoring","Harsh inspiratory stridor","Intermittent inspiratory or expiratory noise from airway secretions","Musical expiratory wheeze"],"ans":2,"exp":"Rattling reflects secretions in the airways and may be audible in inspiration or expiration."},{"en":"Which description best matches wheezing?","opts":["Low-pitched inspiratory noise","Harsh laryngeal noise","Noise from airway secretions","Musical, predominantly expiratory sound from lower-airway obstruction"],"ans":3,"exp":"Wheezing is a musical sound, most often expiratory, associated with lower-airway narrowing."},{"en":"Which sites are useful when examining a child for pallor?","opts":["Mouth and inner lip mucosa","Lower eyelid conjunctiva","Palms and palmar creases","All of the above"],"ans":3,"exp":"Examine the oral mucosa, lower eyelids, palms and creases; the distribution improves assessment of pallor."},{"en":"Which is NOT a typical cause of central cyanosis?","opts":["Alveolar hypoventilation","Cyanotic congenital heart disease","Raynaud phenomenon","Pulmonary arteriovenous malformation"],"ans":2,"exp":"Raynaud phenomenon affects peripheral circulation and may cause peripheral color change while sparing the mucosae."},{"en":"Which is NOT a typical cause of peripheral cyanosis?","opts":["Cold exposure","Raynaud phenomenon","Peripheral vascular obstruction","Alveolar hypoventilation"],"ans":3,"exp":"Alveolar hypoventilation affects systemic oxygenation and points toward central cyanosis, unlike the peripheral circulation problems listed."},{"en":"Which statement is NOT characteristic of central cyanosis?","opts":["It occurs in the tongue only","The hands may be warm","Warming the hand does not correct systemic hypoxemia","Clubbing may accompany chronic disease"],"ans":0,"exp":"Central cyanosis involves the mucosae and may extend to the extremities; it is not limited to the tongue."},{"en":"Which statement is NOT characteristic of peripheral cyanosis?","opts":["It involves the tongue and extremities","The hands may be cold","Warming the hand may improve the color","Clubbing is usually absent"],"ans":0,"exp":"Peripheral cyanosis affects the extremities and generally spares mucous membranes such as the tongue."},{"en":"Where may jaundice first be seen on examination?","opts":["Soft palate","Sclera","Both","Neither"],"ans":2,"exp":"Early yellow discoloration may be noticed at the sclerae and oral mucosa, including the soft palate."},{"en":"Visible scleral jaundice may appear around which bilirubin level?","opts":["1 mg/dL","2.5 mg/dL","5 mg/dL","10 mg/dL"],"ans":1,"exp":"Scleral discoloration can become visible around 2–3 mg/dL; appearance varies and is not a bilirubin measurement."},{"en":"Visible skin jaundice in a neonate may appear around which bilirubin level?","opts":["1 mg/dL","2.5 mg/dL","5 mg/dL","10 mg/dL"],"ans":2,"exp":"A commonly taught approximate threshold is 5 mg/dL. Skin color alone cannot determine the actual bilirubin concentration."},{"en":"Which statement about neonatal jaundice is FALSE?","opts":["It is yellow discoloration of skin and mucous membranes","It may appear in the skin around bilirubin 5 mg/dL","It starts in the feet and spreads upward","Blanching the skin can help reveal yellow color"],"ans":2,"exp":"Jaundice classically spreads from the face downward; it does not usually start in the feet and ascend."},{"en":"On the Kramer teaching map, jaundice reaching palms and soles corresponds roughly to:","opts":["5 mg/dL","10 mg/dL","15 mg/dL","20 mg/dL or higher"],"ans":3,"exp":"Palms and soles represent the final Kramer zone, roughly 20 mg/dL or higher in the teaching diagram. Confirm with an objective bilirubin test."},{"en":"Which artery is commonly used to examine the pulse in an older child?","opts":["Radial artery","Carotid artery","Femoral artery","Brachial artery"],"ans":0,"exp":"The radial artery at the wrist is a convenient site for assessing the peripheral pulse in an older cooperative child."},{"en":"Which may raise concern that a baby is not satisfied after breastfeeding?","opts":["Staying at the breast for more than 30 minutes","Being comfortable or sleeping for 2–4 hours","Appropriate weight gain","Good urine and stool output"],"ans":0,"exp":"A prolonged feed may prompt assessment of latch and milk transfer. Duration alone does not prove inadequate intake; assess weight gain, wet nappies and overall behavior too."},{"en":"Which description best fits a confused child?","opts":["Reduced alertness and difficulty staying awake","Disorientation and inability to connect ideas","Arousable by moderate stimulation, then asleep again","Arousable only by repeated vigorous stimulation"],"ans":1,"exp":"Confusion primarily affects orientation and coherent thinking; reduced alertness with difficulty staying awake describes a different change in consciousness."},{"en":"Which description best fits a lethargic child?","opts":["Reduced awareness with disorientation","Disoriented and unable to connect ideas","Arousable by moderate stimulation, then falls asleep again","Arousable only by repeated vigorous stimulation"],"ans":2,"exp":"Lethargy involves reduced alertness and sleepiness. A child who can be roused but drifts back to sleep fits this option better than disorientation, which describes confusion."},{"en":"Which description best fits a stuporous child?","opts":["Reduced awareness and difficulty following commands","Disoriented and unable to connect ideas","Arousable by moderate stimulation, then falls asleep again","Arousable only by repeated vigorous stimulation"],"ans":3,"exp":"Stupor is a profound reduction in responsiveness: the child responds only to vigorous or repeated stimulation. This differs from milder sleepiness."},{"en":"Which functions are assessed by the Glasgow Coma Scale?","opts":["Verbal response","Eye opening","Motor response","All of the above"],"ans":3,"exp":"The three GCS components are eye opening (maximum 4), verbal response (maximum 5) and motor response (maximum 6)."}]}];

let curSection=null, i=0, score=0, answered=false, missed=[];
const app=document.getElementById('app');

function home(){
  curSection=null;
  const prog=getQuizProgress();
  let html='<div class="eyebrow">General Appearance MCQs</div><div class="sec-grid">';
  SECTIONS.forEach((s,idx)=>{
    const done=prog[idx]&&prog[idx].done;
    html+=`<div class="sec-card" onclick="startSection(${idx})">
      <div class="sec-top"><div class="sec-icon">${s.icon}</div><span class="sec-status${done?' done':''}">${done?'Completed · '+prog[idx].pct+'%':'Not started'}</span></div>
      <div class="sec-title">${s.en}</div>
      <div class="sec-count">${s.q.length} Questions</div>
    </div>`;
  });
  html+='</div><div class="intro-note">Start the complete round below. Your progress is saved automatically on this device.</div>';
  app.innerHTML=html;
}

function startSection(idx){
  curSection=idx; i=0; score=0; missed=[];
  render();
}

function render(){
  const sec=SECTIONS[curSection], q=sec.q[i], pct=Math.round(i/sec.q.length*100);
  app.innerHTML=`<div class="topline">
    <div><div class="eyebrow">Score</div><div class="score-num">${score}<span> / ${sec.q.length}</span></div></div>
    <div class="topline-right">
      <div class="sec-label">${sec.en.toUpperCase()}</div>
      <div class="qcount">Question ${String(i+1).padStart(2,'0')} of ${sec.q.length}</div>
      <button class="back-link" onclick="home()">‹ Back to quiz start</button>
    </div>
  </div>
  <div class="progress-bar"><i style="width:${pct}%"></i></div>
  <div class="qbox">
    <div class="qwatermark">${String(i+1).padStart(2,'0')}</div>
    <div class="question-en">${q.en}</div>
  </div>
  <div class="choices">${q.opts.map((x,n)=>`<button class="choice" onclick="choose(${n})"><span class="badge">${String.fromCharCode(65+n)}</span><span>${x}</span></button>`).join('')}</div>
  <div id="feedback" class="feedback"></div>
  <div class="actions"><span class="hint">Choose one answer, then click Next</span><button id="next" class="btn next" disabled onclick="nextQ()">Next →</button></div>`;
  answered=false;
}

function choose(n){
  if(answered)return;
  answered=true;
  const sec=SECTIONS[curSection], q=sec.q[i], buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach(b=>b.disabled=true);
  buttons[q.ans].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(n===q.ans){
    score++;
    fb.className='feedback show good';
    fb.innerHTML=`<b>Correct!</b><div class="explain">${q.exp}</div>`;
  }else{
    buttons[n].classList.add('wrong');
    missed.push({num:i+1,en:q.en,correct:q.opts[q.ans]});
    fb.className='feedback show bad';
    fb.innerHTML=`<b>Not quite.</b><div class="explain">Correct answer: ${q.opts[q.ans]}<br>${q.exp}</div>`;
  }
  document.getElementById('next').disabled=false;
  document.querySelector('.score-num').innerHTML=`${score}<span> / ${sec.q.length}</span>`;
}

function nextQ(){
  const sec=SECTIONS[curSection];
  if(i<sec.q.length-1){i++;render()}else{result()}
}

function result(){
  const sec=SECTIONS[curSection], pct=Math.round(score/sec.q.length*100);
  saveQuizProgress(curSection,score,sec.q.length);
  let msg=pct>=85?'Excellent review.':pct>=65?'Solid work — revisit the points you missed.':'Review the summary again, then retake the quiz.';
  app.innerHTML=`<div class="result">
    <span class="eyebrow">Final Result · ${sec.en}</span>
    <div class="score-big">${score}/${sec.q.length}</div>
    <h2>${pct}%</h2>
    <p>${msg}</p>
    ${missed.length?`<div class="review"><b>Review points</b>${missed.map(x=>`<div><span class="tag">Q${x.num}</span> ${x.en}<br><small>Correct: <b>${x.correct}</b></small></div>`).join('')}</div>`:'<p>All correct. Well done!</p>'}
    <div class="result-actions">
      <button class="btn restart" onclick="startSection(${curSection})">Retry section</button>
      <button class="btn ghost" onclick="home()">Quiz start</button>
    </div>
  </div>`;
}

home();
</script>
</body>
</html>
